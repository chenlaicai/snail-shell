# SOP: 演进治理流程
# 来源: platform (Snail Shell 平台预设)
# 文件名即 key: evolution

name: 演进治理流程
description: 演进项治理。

stage_definitions:
  - key: development
    title: 演进治理
    sequence: 1
    output_description: >
      完成演进项治理，必要时提交系统提示词、skill、文档、代码或检查器 PR，并回写治理去向。
    acceptance_focus:
      - 演进项来源和事实被查证
      - 入口校验、查重、裁决去向已回写
      - 演进项不会绕过治理自动生效
    roles:
      - key: boss
        name: Boss Role
        description: 演进治理对话的决策者，最终确认治理结论。
        is_primary: true
      - key: evolution-executor
        name: 演进执行者
        description: 负责演进项的治理对话：入口校验、查重、裁决去向判断和必要产物处理
        handbook_prompt_ref: "global:S-08"
        working_rules:
          - 逐条分析演进项的内容、来源和作用域
          - 在已知演进项库中查重，确认是全新、重复还是相关但不重复
          - 确定裁决去向和产物形式，与用户确认后通过演进 API 回写
