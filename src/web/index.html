<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snail Shell</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111827;
      color: #e5e7eb;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 64px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #243042;
      background: #0f172a;
    }
    header h1 { font-size: 18px; font-weight: 700; }
    header h1 span { color: #f97316; }
    .project-pill {
      font-size: 13px;
      color: #cbd5e1;
      background: #1e293b;
      border: 1px solid #334155;
      padding: 6px 10px;
      border-radius: 999px;
    }
    .app-shell {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 292px minmax(0, 1fr) 320px;
    }
    .sidebar, .context-panel {
      min-height: 0;
      overflow: auto;
      background: #0b1220;
      border-right: 1px solid #1f2937;
    }
    .context-panel {
      border-right: none;
      border-left: 1px solid #1f2937;
    }
    .main-panel {
      min-height: 0;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.08), transparent 30%),
        #111827;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
    }
    .sidebar-main {
      flex: 1;
      min-height: 0;
      overflow: auto;
    }
    .sidebar-footer {
      padding: 14px 18px 18px;
      border-top: 1px solid #1f2937;
      background: rgba(2, 6, 23, 0.22);
    }
    .panel-section {
      padding: 18px;
      border-bottom: 1px solid #1f2937;
    }
    .panel-section.compact {
      padding-bottom: 12px;
    }
    .panel-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #94a3b8;
      margin-bottom: 12px;
    }
    .project-list,
    .feature-list,
    .conversation-list,
    .stage-list,
    .artifact-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .nav-item,
    .feature-row,
    .conversation-row,
    .stage-card,
    .prompt-card,
    .artifact-card {
      border: 1px solid #243042;
      background: #111827;
      border-radius: 12px;
      padding: 12px;
    }
    .nav-item.active,
    .feature-row.active,
    .conversation-row.active,
    .stage-card.active,
    .prompt-card.active {
      border-color: #f97316;
      background: #172033;
    }
    .pending-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      background: #f59e0b;
      color: #111827;
      font-size: 12px;
      font-weight: 700;
    }
    .nav-item button,
    .feature-select-button,
    .conversation-row button,
    button {
      width: 100%;
      background: transparent;
      color: inherit;
      text-align: left;
      border: none;
      font: inherit;
      cursor: pointer;
    }
    .name { font-weight: 600; margin-bottom: 4px; }
    .meta { font-size: 12px; color: #94a3b8; }
    .feature-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
    }
    .feature-row.archived {
      opacity: 0.72;
    }
    .feature-group-title {
      margin: 10px 2px 2px;
      padding-top: 10px;
      border-top: 1px solid #1f2937;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }
    .feature-archive-button {
      width: auto;
      padding: 5px 9px;
      border: 1px solid #334155;
      border-radius: 999px;
      color: #cbd5e1;
      font-size: 12px;
      white-space: nowrap;
    }
    .feature-archive-button:hover {
      border-color: #f97316;
      color: #fed7aa;
    }
    .project-summary-card {
      border: 1px solid rgba(51, 65, 85, 0.72);
      border-radius: 16px;
      padding: 14px;
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.72), rgba(15, 23, 42, 0.86));
    }
    .nav-actions {
      display: grid;
      gap: 8px;
    }
    .nav-action-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid rgba(51, 65, 85, 0.72);
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.72);
      color: #cbd5e1;
      font-size: 13px;
    }
    .nav-action-button span:last-child {
      color: #64748b;
    }
    .workspace-header {
      padding: 18px 20px;
      border-bottom: 1px solid #1f2937;
      background: rgba(15, 23, 42, 0.94);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }
    .workspace-header h2 { font-size: 20px; margin-bottom: 6px; }
    .workspace-heading {
      min-width: 0;
    }
    .workspace-status-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }
    .workspace-next-step {
      font-size: 12px;
      color: #93c5fd;
    }
    .breadcrumbs { font-size: 12px; color: #94a3b8; }
    .boss-mentions-banner {
      display: none;
      margin: 16px 24px 0;
      padding: 14px;
      border: 1px solid rgba(251, 191, 36, 0.35);
      border-radius: 14px;
      background: rgba(120, 53, 15, 0.18);
    }
    .boss-mentions-banner.visible {
      display: block;
    }
    .boss-mention-item {
      width: 100%;
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid #475569;
      color: #e5e7eb;
      text-align: left;
    }
    .msg.jump-highlight {
      box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.8);
      transition: box-shadow 160ms ease;
    }
    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 78%;
      padding: 12px 14px;
      border-radius: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #1d4ed8;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #172554;
      border: 1px solid #1d4ed8;
      border-bottom-left-radius: 4px;
    }
    .msg-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 4px;
    }
    .msg .role {
      font-size: 11px;
      color: #bfdbfe;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .msg .timestamp {
      flex-shrink: 0;
      font-size: 11px;
      color: #94a3b8;
      font-variant-numeric: tabular-nums;
    }
    .msg.loading {
      color: #94a3b8;
      font-style: italic;
      border-style: dashed;
      background: rgba(15, 23, 42, 0.92);
    }
    .running-snail {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #bfdbfe;
      font-size: 13px;
      font-style: normal;
    }
    .snail-track {
      position: relative;
      flex: 0 0 54px;
      height: 20px;
      overflow: hidden;
      border-bottom: 1px dotted rgba(191, 219, 254, 0.52);
    }
    .snail-icon {
      position: absolute;
      left: 0;
      bottom: -2px;
      display: inline-block;
      font-size: 18px;
      line-height: 1;
      animation: snail-crawl 1.8s ease-in-out infinite;
    }
    @keyframes snail-crawl {
      0% { transform: translateX(0) rotate(-2deg); }
      45% { transform: translateX(26px) rotate(2deg); }
      100% { transform: translateX(0) rotate(-2deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .snail-icon { animation: none; }
    }
    .msg.question {
      max-width: min(78%, 760px);
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.96), rgba(15, 23, 42, 0.9));
      border: 1px solid rgba(96, 165, 250, 0.24);
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.36);
    }
    .msg.assistant.message-shell {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: linear-gradient(180deg, rgba(23, 37, 84, 0.96), rgba(15, 23, 42, 0.96));
    }
    .assistant-part {
      white-space: pre-wrap;
      word-break: break-word;
    }
    .message-card {
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.56);
      overflow: hidden;
    }
    .message-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      background: rgba(30, 41, 59, 0.55);
      color: #bfdbfe;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .message-card-body {
      padding: 12px;
      color: #dbeafe;
      font-size: 13px;
      line-height: 1.65;
    }
    .message-card-meta {
      color: #94a3b8;
      font-size: 12px;
    }
    .message-context-block {
      border: 1px solid rgba(249, 115, 22, 0.34);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(67, 56, 202, 0.22), rgba(15, 23, 42, 0.68));
      overflow: hidden;
    }
    .message-context-block summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      cursor: pointer;
      list-style: none;
      color: #fed7aa;
      font-size: 12px;
      font-weight: 700;
    }
    .message-context-block summary::-webkit-details-marker { display: none; }
    .message-context-label { letter-spacing: 0.04em; }
    .message-context-hint {
      color: #94a3b8;
      font-size: 11px;
      font-weight: 500;
    }
    .message-context-body {
      padding: 12px;
      border-top: 1px solid rgba(249, 115, 22, 0.18);
    }
    .message-context-body > .message-card,
    .message-context-body > .assistant-part {
      background: rgba(15, 23, 42, 0.42);
    }
    .message-event-stream {
      border: 1px solid rgba(96, 165, 250, 0.22);
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.58);
      overflow: hidden;
    }
    .message-event-stream summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      cursor: pointer;
      list-style: none;
      color: #bfdbfe;
      font-size: 12px;
      font-weight: 700;
    }
    .message-event-stream summary::-webkit-details-marker { display: none; }
    .message-event-stream summary::before {
      content: ">";
      flex-shrink: 0;
      display: inline-block;
      transition: transform 140ms ease;
    }
    .message-event-stream[open] > summary::before {
      transform: rotate(90deg);
    }
    .message-event-stream-label {
      flex: 1;
      letter-spacing: 0.04em;
    }
    .message-event-stream-hint {
      color: #94a3b8;
      font-size: 11px;
      font-weight: 500;
    }
    .message-event-stream-body {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid rgba(96, 165, 250, 0.14);
      background: rgba(2, 6, 23, 0.24);
    }
    .markdown-block h1,
    .markdown-block h2,
    .markdown-block h3 {
      margin: 0 0 8px;
      color: #eff6ff;
      line-height: 1.3;
    }
    .markdown-block p,
    .markdown-block ul,
    .markdown-block ol,
    .markdown-block pre,
    .markdown-block blockquote {
      margin: 0 0 10px;
    }
    .markdown-block ul,
    .markdown-block ol {
      padding-left: 18px;
    }
    .markdown-block code {
      padding: 1px 5px;
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.88);
      color: #fde68a;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
    }
    .markdown-block pre {
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.92);
      color: #cbd5e1;
      overflow: auto;
    }
    .markdown-block blockquote {
      padding-left: 12px;
      border-left: 3px solid rgba(96, 165, 250, 0.5);
      color: #93c5fd;
    }
    .table-block table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .table-block th,
    .table-block td {
      padding: 9px 10px;
      border: 1px solid rgba(148, 163, 184, 0.16);
      text-align: left;
      vertical-align: top;
    }
    .table-block th {
      background: rgba(30, 41, 59, 0.72);
      color: #eff6ff;
      font-weight: 600;
    }
    .table-block td {
      color: #dbeafe;
      background: rgba(15, 23, 42, 0.4);
    }
    .assistant-part .mention {
      color: #60a5fa;
      font-weight: 500;
      background: rgba(96, 165, 250, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .message-event-block {
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.72);
      color: #cbd5e1;
      font-size: 12px;
      line-height: 1.55;
      overflow: hidden;
    }
    .message-event-block summary {
      display: flex;
      align-items: baseline;
      gap: 8px;
      cursor: pointer;
      list-style: none;
      padding: 10px 12px;
      user-select: none;
    }
    .message-event-block summary::-webkit-details-marker {
      display: none;
    }
    .message-event-block summary::before {
      content: ">";
      flex-shrink: 0;
      display: inline-block;
      transition: transform 140ms ease;
    }
    .message-event-block[open] > summary::before {
      transform: rotate(90deg);
    }
    .message-event-kind {
      flex-shrink: 0;
      color: #93c5fd;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
    }
    .message-event-summary {
      min-width: 0;
      color: #dbeafe;
      white-space: pre-wrap;
    }
    .message-event-body {
      max-height: 360px;
      overflow: auto;
      border-top: 1px solid rgba(148, 163, 184, 0.12);
      padding: 10px;
      background: rgba(2, 6, 23, 0.34);
      color: #cbd5e1;
    }
    .message-event-detail {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .message-event-block.error {
      border-color: rgba(248, 113, 113, 0.3);
      background: rgba(127, 29, 29, 0.24);
      color: #fecaca;
    }
    .message-event-text {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .message-event-label {
      color: #93c5fd;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .question-title {
      margin-bottom: 8px;
      font-size: 16px;
      font-weight: 700;
      color: #eff6ff;
    }
    .question-body {
      color: #dbeafe;
      margin-bottom: 10px;
    }
    .question-reason {
      margin-bottom: 14px;
      padding: 10px 12px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 12px;
      background: rgba(30, 41, 59, 0.56);
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.5;
    }
    .question-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .question-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 2px;
    }
    .question-selection-hint {
      color: #93c5fd;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .question-selection-count {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.14);
      border: 1px solid rgba(96, 165, 250, 0.24);
      color: #bfdbfe;
      font-size: 12px;
      font-weight: 600;
    }
    .question-options {
      display: grid;
      gap: 10px;
    }
    .question-option {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.72);
      transition: border-color 140ms ease, background 140ms ease, transform 140ms ease, box-shadow 140ms ease;
    }
    .question-option:hover {
      border-color: rgba(96, 165, 250, 0.5);
      background: rgba(30, 41, 59, 0.9);
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.22);
    }
    .question-option-label {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      cursor: pointer;
    }
    .question-option input {
      width: 18px;
      height: 18px;
      margin: 2px 0 0;
      accent-color: #60a5fa;
    }
    .question-option-title {
      color: #f8fafc;
      font-weight: 600;
      line-height: 1.4;
    }
    .question-option-description {
      margin-top: 4px;
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.5;
    }
    .question-option-extra {
      margin-left: 30px;
      display: none;
      border-color: rgba(96, 165, 250, 0.18);
      background: rgba(15, 23, 42, 0.9);
    }
    .question-option:has(input:checked) {
      border-color: rgba(96, 165, 250, 0.72);
      background: linear-gradient(180deg, rgba(30, 64, 175, 0.18), rgba(15, 23, 42, 0.84));
      box-shadow: 0 12px 26px rgba(37, 99, 235, 0.18);
    }
    .question-option:has(input:checked) .question-option-extra {
      display: block;
    }
    .question-actions {
      margin-top: 4px;
      justify-content: flex-end;
    }
    .question-submit {
      min-width: 112px;
    }
    .question-submit[disabled] {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .tool-indicator { margin-top: 8px; font-size: 12px; color: #fbbf24; }
    .composer {
      border-top: 1px solid #1f2937;
      padding: 16px 20px 20px;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .reply-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid #334155;
      border-radius: 12px;
      background: rgba(30, 41, 59, 0.7);
      color: #cbd5e1;
      font-size: 13px;
    }
    .reply-banner.visible {
      display: flex;
    }
    .reply-banner strong {
      color: #93c5fd;
    }
    .reply-cancel {
      width: auto;
      color: #94a3b8;
      padding: 0;
    }
    .msg-actions {
      margin-top: 8px;
      display: flex;
      gap: 10px;
    }
    .msg-action {
      width: auto;
      color: #93c5fd;
      font-size: 12px;
    }
    .quote-block {
      margin-bottom: 8px;
      padding: 8px 10px;
      border-left: 3px solid #60a5fa;
      background: rgba(15, 23, 42, 0.55);
      border-radius: 8px;
      color: #cbd5e1;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    textarea, input, select {
      width: 100%;
      background: #111827;
      color: #e5e7eb;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
    }
    textarea { resize: vertical; }
    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .composer-hints {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .mention-status {
      min-height: 18px;
      font-size: 12px;
      color: #94a3b8;
    }
    .mention-status.error {
      color: #fca5a5;
    }
    .mention-status.info {
      color: #93c5fd;
    }
    .mention-suggestions {
      display: none;
      flex-direction: column;
      gap: 6px;
      padding: 10px;
      border: 1px solid #334155;
      border-radius: 12px;
      background: #0b1220;
    }
    .mention-suggestions.visible {
      display: flex;
    }
    .mention-suggestion {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px 12px;
      border: 1px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      background: rgba(15, 23, 42, 0.8);
    }
    .mention-suggestion.active {
      border-color: #60a5fa;
      background: rgba(30, 41, 59, 0.95);
    }
    .mention-suggestion-title {
      font-size: 13px;
      font-weight: 600;
      color: #eff6ff;
    }
    .mention-suggestion-meta {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
    }
    .primary-button,
    .secondary-button,
    .ghost-button {
      width: auto;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 600;
    }
    .primary-button { background: #f97316; color: white; }
    .secondary-button { background: #2563eb; color: white; }
    .ghost-button { background: #1f2937; color: #e5e7eb; }
    .danger-button {
      width: auto;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 600;
      background: #7f1d1d;
      color: #fecaca;
      border: 1px solid #b91c1c;
    }
    .danger-button[hidden] { display: none; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .badge {
      display: inline-flex;
      width: auto;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #1f2937;
      color: #cbd5e1;
    }
    .badge.in_progress { background: #1e3a8a; color: #dbeafe; }
    .badge.in_review { background: #78350f; color: #fef3c7; }
    .badge.approved { background: #14532d; color: #dcfce7; }
    .badge.rejected, .badge.cancelled { background: #7f1d1d; color: #fee2e2; }
    .context-panel {
      padding: 16px;
    }
    .context-rail {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .context-card {
      border: 1px solid rgba(51, 65, 85, 0.78);
      border-radius: 18px;
      padding: 14px;
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.62), rgba(15, 23, 42, 0.86));
      box-shadow: 0 18px 44px rgba(2, 6, 23, 0.18);
    }
    .context-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .context-card-title {
      color: #f8fafc;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .context-card-link {
      width: auto;
      color: #93c5fd;
      font-size: 12px;
      font-weight: 700;
    }
    .context-line {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 0;
      border-top: 1px solid rgba(51, 65, 85, 0.44);
      font-size: 13px;
    }
    .context-line:first-of-type {
      border-top: none;
      padding-top: 0;
    }
    .context-line span:first-child {
      color: #94a3b8;
    }
    .context-line span:last-child {
      color: #e2e8f0;
      text-align: right;
    }
    .participant-stack,
    .deliverable-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .participant-pill,
    .deliverable-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid rgba(51, 65, 85, 0.58);
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.58);
      font-size: 12px;
      color: #cbd5e1;
    }
    .participant-pill strong,
    .deliverable-pill strong {
      color: #f8fafc;
      font-size: 13px;
    }
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      background: rgba(2, 6, 23, 0.58);
      backdrop-filter: blur(4px);
    }
    .drawer-backdrop.visible {
      display: block;
    }
    .inspector-drawer {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 40;
      width: min(760px, 92vw);
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #0b1220;
      border-left: 1px solid #334155;
      box-shadow: -28px 0 80px rgba(2, 6, 23, 0.42);
      transform: translateX(100%);
      transition: transform 180ms ease;
    }
    .inspector-drawer.visible {
      transform: translateX(0);
    }
    .inspector-header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid #1f2937;
      background: #0f172a;
    }
    .inspector-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .inspector-title-row h2 {
      font-size: 18px;
    }
    .inspector-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .inspector-tab {
      width: auto;
      flex: 0 0 auto;
      padding: 8px 10px;
      border: 1px solid #334155;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.7);
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 700;
    }
    .inspector-tab.active {
      border-color: rgba(249, 115, 22, 0.68);
      background: rgba(154, 52, 18, 0.32);
      color: #fed7aa;
    }
    .inspector-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 18px 20px 28px;
    }
    .inspector-pane {
      display: none;
    }
    .inspector-pane.active {
      display: block;
    }
    .inspector-pane .panel-section {
      padding: 0 0 18px;
      border-bottom: none;
    }
    .artifact-card pre {
      margin-top: 8px;
      background: #0b1220;
      border-radius: 8px;
      padding: 10px;
      white-space: pre-wrap;
      font-size: 12px;
      color: #cbd5e1;
      max-height: 180px;
      overflow: auto;
    }
    .prompt-card { cursor: pointer; }
    .prompt-tools {
      display: grid;
      gap: 10px;
      margin-bottom: 12px;
    }
    .prompt-workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
      min-height: 560px;
    }
    .prompt-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }
    .prompt-stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .prompt-stat {
      padding: 10px;
      border: 1px solid #243042;
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.82), rgba(15, 23, 42, 0.72));
    }
    .prompt-stat strong {
      display: block;
      color: #fed7aa;
      font-size: 20px;
      line-height: 1.1;
    }
    .prompt-stat span {
      display: block;
      margin-top: 3px;
      color: #94a3b8;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .prompt-target-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      border: 1px solid rgba(51, 65, 85, 0.75);
      border-radius: 14px;
      background: rgba(2, 6, 23, 0.18);
    }
    .prompt-target-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 2px 2px 4px;
    }
    .prompt-target-title {
      color: #bfdbfe;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
      word-break: break-word;
    }
    .prompt-card-main {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 10px;
      align-items: start;
    }
    .prompt-order-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 30px;
      height: 28px;
      padding: 0 8px;
      border-radius: 999px;
      background: rgba(249, 115, 22, 0.13);
      border: 1px solid rgba(251, 146, 60, 0.32);
      color: #fdba74;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .prompt-detail {
      min-width: 0;
    }
    .prompt-detail-card {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 100%;
      padding: 14px;
      border: 1px solid #243042;
      border-radius: 16px;
      background: radial-gradient(circle at top right, rgba(249, 115, 22, 0.1), transparent 32%), #111827;
    }
    .prompt-detail-hero {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }
    .prompt-eyebrow,
    .prompt-section-heading {
      color: #93c5fd;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .prompt-detail-title {
      margin: 5px 0 6px;
      color: #f8fafc;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.25;
    }
    .prompt-detail-grid { display: grid; gap: 10px; }
    .prompt-info-panel,
    .prompt-content-panel {
      min-width: 0;
      padding: 12px;
      border: 1px solid rgba(51, 65, 85, 0.72);
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.62);
    }
    .prompt-kv-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: 10px;
      color: #cbd5e1;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      line-height: 1.45;
    }
    .prompt-skill-card {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 10px;
      padding: 10px;
      border: 1px solid rgba(96, 165, 250, 0.16);
      border-radius: 10px;
      background: rgba(30, 41, 59, 0.52);
    }
    .prompt-skill-card strong {
      color: #dbeafe;
      font-size: 12px;
    }
    .prompt-skill-card span {
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.45;
    }
    .prompt-outline {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 10px;
    }
    .prompt-outline-item {
      position: relative;
      padding: 6px 8px 6px 12px;
      border-left: 2px solid rgba(96, 165, 250, 0.36);
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.6);
      color: #cbd5e1;
      font-size: 12px;
      line-height: 1.4;
    }
    .prompt-outline-item.level-2 { margin-left: 12px; }
    .prompt-outline-item.level-3,
    .prompt-outline-item.level-4 { margin-left: 24px; }
    .prompt-detail pre {
      margin-top: 8px;
      background: #0b1220;
      border-radius: 8px;
      padding: 10px;
      white-space: pre-wrap;
      font-size: 12px;
      line-height: 1.55;
      color: #cbd5e1;
      max-height: 360px;
      overflow: auto;
    }
    .prompt-chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .prompt-chip {
      display: inline-flex;
      align-items: center;
      border: 1px solid #334155;
      border-radius: 999px;
      padding: 3px 8px;
      background: rgba(15, 23, 42, 0.72);
      color: #cbd5e1;
      font-size: 11px;
    }
    .prompt-chip.accent {
      border-color: rgba(249, 115, 22, 0.42);
      background: rgba(154, 52, 18, 0.24);
      color: #fed7aa;
    }
    .dispatch-group {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.6);
    }
    .dispatch-group .name {
      font-weight: 600;
      color: #e5e7eb;
    }
    .dispatch-preview {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #334155;
      font-size: 12px;
      color: #cbd5e1;
      white-space: pre-wrap;
    }
    .empty-state { color: #94a3b8; font-size: 13px; padding: 8px 0; }
    .small-label { display: block; margin-bottom: 6px; font-size: 12px; color: #94a3b8; }
    @media (max-width: 1180px) {
      .app-shell { grid-template-columns: 260px minmax(0, 1fr); }
      .context-panel { display: none; }
    }
    @media (max-width: 760px) {
      header { height: auto; min-height: 58px; padding: 12px 14px; }
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .workspace-header { padding: 14px; flex-direction: column; }
      #messages { padding: 16px 14px; }
      .msg { max-width: 92%; }
      .composer { padding: 14px; }
      .inspector-drawer { width: 100vw; }
    }
  </style>
</head>
<body>
  <header>
    <h1><span>Snail</span> Shell</h1>
    <div class="project-pill" id="top-project-state">未选择项目</div>
  </header>
  <div id="app-notice" style="display:none; padding:10px 20px; background:#1d4ed8; color:white; font-size:13px;"></div>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-main">
        <section class="panel-section compact">
          <div class="panel-title">Workspace</div>
          <div class="project-summary-card" id="project-summary-card">
            <div class="name">未选择项目</div>
            <div class="meta">选择项目后查看当前协作线</div>
          </div>
          <div class="button-row" style="margin-top: 12px;">
            <button class="primary-button" id="new-project-btn">新建项目</button>
          </div>
        </section>

        <section class="panel-section">
          <div class="panel-title">Projects</div>
          <div class="project-list" id="project-list"></div>
        </section>

        <section class="panel-section">
          <div class="panel-title">Features</div>
          <div class="button-row" style="margin-bottom: 12px;">
            <button class="secondary-button" id="new-feature-btn">新建 Feature</button>
          </div>
          <div class="feature-list" id="feature-list"></div>
        </section>

        <section class="panel-section">
          <div class="panel-title">Conversations</div>
          <div class="button-row" style="margin-bottom: 12px;">
            <button class="secondary-button" id="new-conversation-btn">新建对话</button>
          </div>
          <div class="conversation-list" id="conversation-list"></div>
        </section>
      </div>

      <div class="sidebar-footer">
        <div class="nav-actions">
          <button class="nav-action-button" data-inspector-open="prompts"><span>Prompt Center</span><span>配置</span></button>
          <button class="nav-action-button" data-inspector-open="system"><span>System State</span><span>诊断</span></button>
        </div>
      </div>
    </aside>

    <main class="main-panel">
      <div class="workspace-header">
        <div class="workspace-heading">
          <h2 id="conversation-title">未选择对话</h2>
          <div class="breadcrumbs" id="conversation-breadcrumbs">请选择一个项目。</div>
          <div class="workspace-status-row">
            <button type="button" id="workspace-stage-badge" class="badge">无活跃阶段</button>
            <span class="workspace-next-step" id="workspace-next-step">选择项目以开始。</span>
          </div>
        </div>
        <button class="ghost-button" data-inspector-open="stage">Context</button>
      </div>

      <div id="boss-mentions-banner" class="boss-mentions-banner"></div>

      <div id="messages"></div>

      <div class="composer">
        <div id="reply-banner" class="reply-banner">
          <div id="reply-banner-text"></div>
          <button type="button" id="reply-cancel" class="reply-cancel">取消</button>
        </div>
        <textarea id="input" placeholder="输入 @Design Snail 与指定 snail 对话；未指定时默认发送给当前主 snail" rows="2"></textarea>
        <div class="composer-hints">
          <div id="mention-status" class="mention-status"></div>
          <div id="mention-suggestions" class="mention-suggestions"></div>
        </div>
        <div class="button-row">
          <button class="primary-button" id="send-btn">发送</button>
          <button class="danger-button" id="interrupt-btn" type="button" hidden>中断 Snail</button>
        </div>
      </div>
    </main>

    <aside class="context-panel">
      <div class="context-rail">
        <section class="context-card" id="stage-summary-card"></section>
        <section class="context-card" id="participants-summary-card"></section>
        <section class="context-card" id="deliverables-summary-card"></section>
      </div>
    </aside>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="inspector-drawer" id="inspector-drawer" aria-hidden="true">
    <div class="inspector-header">
      <div class="inspector-title-row">
        <div>
          <h2>Inspector</h2>
          <div class="meta">按需查看规则、产物、提示词和系统状态</div>
        </div>
        <button class="ghost-button" id="inspector-close">关闭</button>
      </div>
      <div class="inspector-tabs" id="inspector-tabs">
        <button class="inspector-tab active" data-inspector-tab="stage">Stage</button>
        <button class="inspector-tab" data-inspector-tab="artifacts">Deliverables</button>
        <button class="inspector-tab" data-inspector-tab="prompts">Prompt Center</button>
        <button class="inspector-tab" data-inspector-tab="system">System State</button>
      </div>
    </div>
    <div class="inspector-body">
      <section class="inspector-pane active" data-inspector-pane="stage">
        <div class="panel-section">
          <div class="panel-title">Stage Chain</div>
          <div class="button-row" style="margin-bottom: 12px;">
            <button class="ghost-button" id="next-stage-btn">推进到下一阶段</button>
            <button class="secondary-button" id="restart-development-btn">开启新研发迭代</button>
          </div>
          <div class="stage-list" id="stage-list"></div>
          <div id="stage-contract" style="margin-top: 14px;"></div>
        </div>
      </section>
      <section class="inspector-pane" data-inspector-pane="artifacts">
        <div class="panel-section">
          <div class="panel-title">Deliverables</div>
          <label class="small-label" for="artifact-type">Artifact Type</label>
          <select id="artifact-type"></select>
          <label class="small-label" for="artifact-title" style="margin-top: 10px;">标题</label>
          <input id="artifact-title" placeholder="artifact 标题">
          <label class="small-label" for="artifact-content" style="margin-top: 10px;">内容</label>
          <textarea id="artifact-content" rows="6" placeholder="artifact 内容"></textarea>
          <div class="button-row" style="margin-top: 12px; margin-bottom: 14px;">
            <button class="secondary-button" id="create-artifact-btn">创建 Artifact</button>
            <button class="ghost-button" id="set-formal-artifact-btn">设为正式交付</button>
          </div>
          <div class="artifact-list" id="artifact-list"></div>
        </div>
      </section>
      <section class="inspector-pane" data-inspector-pane="prompts">
        <div class="panel-section">
          <div class="panel-title">Prompt Library</div>
          <div class="prompt-tools">
            <input id="prompt-search" placeholder="搜索 id / title / target / 内容">
            <select id="prompt-target-filter"></select>
          </div>
          <div class="prompt-workspace">
            <div class="prompt-list" id="prompt-list"></div>
            <div class="prompt-detail" id="prompt-detail"></div>
          </div>
        </div>
      </section>
      <section class="inspector-pane" data-inspector-pane="system">
        <div class="panel-section">
          <div class="panel-title">Bus State</div>
          <div id="dispatch-state-list"></div>
        </div>
      </section>
    </div>
  </aside>

  <script type="module" src="./app.js"></script>
</body>
</html>
