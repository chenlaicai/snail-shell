<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snail Shell</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111827;
      color: #e5e7eb;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 64px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #243042;
      background: #0f172a;
    }
    header h1 { font-size: 18px; font-weight: 700; }
    header h1 span { color: #f97316; }
    .project-pill {
      font-size: 13px;
      color: #cbd5e1;
      background: #1e293b;
      border: 1px solid #334155;
      padding: 6px 10px;
      border-radius: 999px;
    }
    .app-shell {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr) 340px;
    }
    .sidebar, .context-panel {
      min-height: 0;
      overflow: auto;
      background: #0b1220;
      border-right: 1px solid #1f2937;
    }
    .context-panel {
      border-right: none;
      border-left: 1px solid #1f2937;
    }
    .main-panel {
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #111827;
    }
    .panel-section {
      padding: 18px;
      border-bottom: 1px solid #1f2937;
    }
    .panel-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #94a3b8;
      margin-bottom: 12px;
    }
    .project-list,
    .conversation-list,
    .stage-list,
    .artifact-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .nav-item,
    .conversation-row,
    .stage-card,
    .artifact-card {
      border: 1px solid #243042;
      background: #111827;
      border-radius: 12px;
      padding: 12px;
    }
    .nav-item.active,
    .conversation-row.active,
    .stage-card.active {
      border-color: #f97316;
      background: #172033;
    }
    .pending-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      background: #f59e0b;
      color: #111827;
      font-size: 12px;
      font-weight: 700;
    }
    .nav-item button,
    .conversation-row button,
    button {
      width: 100%;
      background: transparent;
      color: inherit;
      text-align: left;
      border: none;
      font: inherit;
      cursor: pointer;
    }
    .name { font-weight: 600; margin-bottom: 4px; }
    .meta { font-size: 12px; color: #94a3b8; }
    .workspace-header {
      padding: 18px 20px;
      border-bottom: 1px solid #1f2937;
      background: #0f172a;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }
    .workspace-header h2 { font-size: 20px; margin-bottom: 6px; }
    .breadcrumbs { font-size: 12px; color: #94a3b8; }
    .boss-mentions-banner {
      display: none;
      margin: 16px 24px 0;
      padding: 14px;
      border: 1px solid rgba(251, 191, 36, 0.35);
      border-radius: 14px;
      background: rgba(120, 53, 15, 0.18);
    }
    .boss-mentions-banner.visible {
      display: block;
    }
    .boss-mention-item {
      width: 100%;
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid #475569;
      color: #e5e7eb;
      text-align: left;
    }
    .msg.jump-highlight {
      box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.8);
      transition: box-shadow 160ms ease;
    }
    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 78%;
      padding: 12px 14px;
      border-radius: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #1d4ed8;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #172554;
      border: 1px solid #1d4ed8;
      border-bottom-left-radius: 4px;
    }
    .msg-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 4px;
    }
    .msg .role {
      font-size: 11px;
      color: #bfdbfe;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .msg .timestamp {
      flex-shrink: 0;
      font-size: 11px;
      color: #94a3b8;
      font-variant-numeric: tabular-nums;
    }
    .msg.loading {
      color: #94a3b8;
      font-style: italic;
      border-style: dashed;
      background: rgba(15, 23, 42, 0.92);
    }
    .msg.question {
      max-width: min(78%, 760px);
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.96), rgba(15, 23, 42, 0.9));
      border: 1px solid rgba(96, 165, 250, 0.24);
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.36);
    }
    .msg.assistant.message-shell {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: linear-gradient(180deg, rgba(23, 37, 84, 0.96), rgba(15, 23, 42, 0.96));
    }
    .assistant-part {
      white-space: pre-wrap;
      word-break: break-word;
    }
    .message-card {
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.56);
      overflow: hidden;
    }
    .message-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      background: rgba(30, 41, 59, 0.55);
      color: #bfdbfe;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .message-card-body {
      padding: 12px;
      color: #dbeafe;
      font-size: 13px;
      line-height: 1.65;
    }
    .message-card-meta {
      color: #94a3b8;
      font-size: 12px;
    }
    .markdown-block h1,
    .markdown-block h2,
    .markdown-block h3 {
      margin: 0 0 8px;
      color: #eff6ff;
      line-height: 1.3;
    }
    .markdown-block p,
    .markdown-block ul,
    .markdown-block ol,
    .markdown-block pre,
    .markdown-block blockquote {
      margin: 0 0 10px;
    }
    .markdown-block ul,
    .markdown-block ol {
      padding-left: 18px;
    }
    .markdown-block code {
      padding: 1px 5px;
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.88);
      color: #fde68a;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
    }
    .markdown-block pre {
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.92);
      color: #cbd5e1;
      overflow: auto;
    }
    .markdown-block blockquote {
      padding-left: 12px;
      border-left: 3px solid rgba(96, 165, 250, 0.5);
      color: #93c5fd;
    }
    .table-block table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .table-block th,
    .table-block td {
      padding: 9px 10px;
      border: 1px solid rgba(148, 163, 184, 0.16);
      text-align: left;
      vertical-align: top;
    }
    .table-block th {
      background: rgba(30, 41, 59, 0.72);
      color: #eff6ff;
      font-weight: 600;
    }
    .table-block td {
      color: #dbeafe;
      background: rgba(15, 23, 42, 0.4);
    }
    .assistant-part .mention {
      color: #60a5fa;
      font-weight: 500;
      background: rgba(96, 165, 250, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .message-event-activity {
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.72);
      padding: 10px 12px;
      color: #cbd5e1;
      font-size: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
    }
    details.message-event-activity {
      padding: 0;
      overflow: hidden;
    }
    .message-event-activity summary {
      cursor: pointer;
      list-style: none;
      padding: 10px 12px;
      user-select: none;
    }
    .message-event-activity summary::-webkit-details-marker {
      display: none;
    }
    .message-event-activity summary::before {
      content: ">";
      display: inline-block;
      margin-right: 8px;
      transition: transform 140ms ease;
    }
    .message-event-activity[open] summary::before {
      transform: rotate(90deg);
    }
    .message-event-activity-detail {
      max-height: 360px;
      overflow: auto;
      border-top: 1px solid rgba(148, 163, 184, 0.12);
      padding: 10px 12px 12px;
      background: rgba(2, 6, 23, 0.34);
      color: #cbd5e1;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .message-event-activity.error {
      border-color: rgba(248, 113, 113, 0.3);
      background: rgba(127, 29, 29, 0.24);
      color: #fecaca;
    }
    .message-event-text {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .message-event-label {
      color: #93c5fd;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .question-title {
      margin-bottom: 8px;
      font-size: 16px;
      font-weight: 700;
      color: #eff6ff;
    }
    .question-body {
      color: #dbeafe;
      margin-bottom: 10px;
    }
    .question-reason {
      margin-bottom: 14px;
      padding: 10px 12px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 12px;
      background: rgba(30, 41, 59, 0.56);
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.5;
    }
    .question-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .question-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 2px;
    }
    .question-selection-hint {
      color: #93c5fd;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .question-selection-count {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.14);
      border: 1px solid rgba(96, 165, 250, 0.24);
      color: #bfdbfe;
      font-size: 12px;
      font-weight: 600;
    }
    .question-options {
      display: grid;
      gap: 10px;
    }
    .question-option {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.72);
      transition: border-color 140ms ease, background 140ms ease, transform 140ms ease, box-shadow 140ms ease;
    }
    .question-option:hover {
      border-color: rgba(96, 165, 250, 0.5);
      background: rgba(30, 41, 59, 0.9);
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.22);
    }
    .question-option-label {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      cursor: pointer;
    }
    .question-option input {
      width: 18px;
      height: 18px;
      margin: 2px 0 0;
      accent-color: #60a5fa;
    }
    .question-option-title {
      color: #f8fafc;
      font-weight: 600;
      line-height: 1.4;
    }
    .question-option-description {
      margin-top: 4px;
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.5;
    }
    .question-option-extra {
      margin-left: 30px;
      display: none;
      border-color: rgba(96, 165, 250, 0.18);
      background: rgba(15, 23, 42, 0.9);
    }
    .question-option:has(input:checked) {
      border-color: rgba(96, 165, 250, 0.72);
      background: linear-gradient(180deg, rgba(30, 64, 175, 0.18), rgba(15, 23, 42, 0.84));
      box-shadow: 0 12px 26px rgba(37, 99, 235, 0.18);
    }
    .question-option:has(input:checked) .question-option-extra {
      display: block;
    }
    .question-actions {
      margin-top: 4px;
      justify-content: flex-end;
    }
    .question-submit {
      min-width: 112px;
    }
    .question-submit[disabled] {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .tool-indicator { margin-top: 8px; font-size: 12px; color: #fbbf24; }
    .composer {
      border-top: 1px solid #1f2937;
      padding: 16px 20px 20px;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .reply-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid #334155;
      border-radius: 12px;
      background: rgba(30, 41, 59, 0.7);
      color: #cbd5e1;
      font-size: 13px;
    }
    .reply-banner.visible {
      display: flex;
    }
    .reply-banner strong {
      color: #93c5fd;
    }
    .reply-cancel {
      width: auto;
      color: #94a3b8;
      padding: 0;
    }
    .msg-actions {
      margin-top: 8px;
      display: flex;
      gap: 10px;
    }
    .msg-action {
      width: auto;
      color: #93c5fd;
      font-size: 12px;
    }
    .quote-block {
      margin-bottom: 8px;
      padding: 8px 10px;
      border-left: 3px solid #60a5fa;
      background: rgba(15, 23, 42, 0.55);
      border-radius: 8px;
      color: #cbd5e1;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    textarea, input, select {
      width: 100%;
      background: #111827;
      color: #e5e7eb;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
    }
    textarea { resize: vertical; }
    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .composer-hints {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .mention-status {
      min-height: 18px;
      font-size: 12px;
      color: #94a3b8;
    }
    .mention-status.error {
      color: #fca5a5;
    }
    .mention-status.info {
      color: #93c5fd;
    }
    .mention-suggestions {
      display: none;
      flex-direction: column;
      gap: 6px;
      padding: 10px;
      border: 1px solid #334155;
      border-radius: 12px;
      background: #0b1220;
    }
    .mention-suggestions.visible {
      display: flex;
    }
    .mention-suggestion {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px 12px;
      border: 1px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      background: rgba(15, 23, 42, 0.8);
    }
    .mention-suggestion.active {
      border-color: #60a5fa;
      background: rgba(30, 41, 59, 0.95);
    }
    .mention-suggestion-title {
      font-size: 13px;
      font-weight: 600;
      color: #eff6ff;
    }
    .mention-suggestion-meta {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
    }
    .primary-button,
    .secondary-button,
    .ghost-button {
      width: auto;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 600;
    }
    .primary-button { background: #f97316; color: white; }
    .secondary-button { background: #2563eb; color: white; }
    .ghost-button { background: #1f2937; color: #e5e7eb; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #1f2937;
      color: #cbd5e1;
    }
    .badge.in_progress { background: #1e3a8a; color: #dbeafe; }
    .badge.in_review { background: #78350f; color: #fef3c7; }
    .badge.approved { background: #14532d; color: #dcfce7; }
    .badge.rejected, .badge.cancelled { background: #7f1d1d; color: #fee2e2; }
    .artifact-card pre {
      margin-top: 8px;
      background: #0b1220;
      border-radius: 8px;
      padding: 10px;
      white-space: pre-wrap;
      font-size: 12px;
      color: #cbd5e1;
      max-height: 180px;
      overflow: auto;
    }
    .dispatch-group {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.6);
    }
    .dispatch-group .name {
      font-weight: 600;
      color: #e5e7eb;
    }
    .dispatch-preview {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #334155;
      font-size: 12px;
      color: #cbd5e1;
      white-space: pre-wrap;
    }
    .empty-state { color: #94a3b8; font-size: 13px; padding: 8px 0; }
    .small-label { display: block; margin-bottom: 6px; font-size: 12px; color: #94a3b8; }
    @media (max-width: 960px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar, .context-panel { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1><span>Snail</span> Shell</h1>
    <div class="project-pill" id="top-project-state">未选择项目</div>
  </header>
  <div id="app-notice" style="display:none; padding:10px 20px; background:#1d4ed8; color:white; font-size:13px;"></div>

  <div class="app-shell">
    <aside class="sidebar">
      <section class="panel-section">
        <div class="panel-title">Projects</div>
        <div class="button-row" style="margin-bottom: 12px;">
          <button class="primary-button" id="new-project-btn">新建项目</button>
        </div>
        <div class="project-list" id="project-list"></div>
      </section>

      <section class="panel-section">
        <div class="panel-title">Conversations</div>
        <div class="button-row" style="margin-bottom: 12px;">
          <button class="secondary-button" id="new-conversation-btn">新建对话</button>
        </div>
        <div class="conversation-list" id="conversation-list"></div>
      </section>
    </aside>

    <main class="main-panel">
      <div class="workspace-header">
        <div>
          <h2 id="conversation-title">未选择对话</h2>
          <div class="breadcrumbs" id="conversation-breadcrumbs">请选择一个项目。</div>
        </div>
        <div id="workspace-stage-badge" class="badge">无活跃阶段</div>
      </div>

      <div id="boss-mentions-banner" class="boss-mentions-banner"></div>

      <div id="messages"></div>

      <div class="composer">
        <div id="reply-banner" class="reply-banner">
          <div id="reply-banner-text"></div>
          <button type="button" id="reply-cancel" class="reply-cancel">取消</button>
        </div>
        <textarea id="input" placeholder="输入 @Design Snail 与指定 snail 对话；未指定时默认发送给当前主 snail" rows="2"></textarea>
        <div class="composer-hints">
          <div id="mention-status" class="mention-status"></div>
          <div id="mention-suggestions" class="mention-suggestions"></div>
        </div>
        <div class="button-row">
          <button class="primary-button" id="send-btn">发送</button>
        </div>
      </div>
    </main>

    <aside class="context-panel">
      <section class="panel-section">
        <div class="panel-title">Stage Chain</div>
        <div class="button-row" style="margin-bottom: 12px;">
          <button class="ghost-button" id="next-stage-btn">推进到下一阶段</button>
        </div>
        <div class="stage-list" id="stage-list"></div>
        <div id="stage-contract" style="margin-top: 14px;"></div>
      </section>

      <section class="panel-section">
        <div class="panel-title">Artifacts</div>
        <label class="small-label" for="artifact-type">Artifact Type</label>
        <select id="artifact-type"></select>
        <label class="small-label" for="artifact-title" style="margin-top: 10px;">标题</label>
        <input id="artifact-title" placeholder="artifact 标题">
        <label class="small-label" for="artifact-content" style="margin-top: 10px;">内容</label>
        <textarea id="artifact-content" rows="6" placeholder="artifact 内容"></textarea>
        <div class="button-row" style="margin-top: 12px; margin-bottom: 14px;">
          <button class="secondary-button" id="create-artifact-btn">创建 Artifact</button>
          <button class="ghost-button" id="set-formal-artifact-btn">设为正式交付</button>
        </div>
        <div class="artifact-list" id="artifact-list"></div>
      </section>

      <section class="panel-section">
        <div class="panel-title">Bus State</div>
        <div id="dispatch-state-list"></div>
      </section>
    </aside>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
