<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snail Shell</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 16px 24px; background: #16213e; border-bottom: 1px solid #0f3460; display: flex; align-items: center; gap: 16px; }
    header h1 { font-size: 18px; font-weight: 600; }
    header h1 span { color: #e94560; }
    #session-select { background: #0f3460; color: #e0e0e0; border: 1px solid #533483; border-radius: 6px; padding: 6px 10px; font-size: 14px; }
    #new-session-btn { background: #e94560; color: #fff; border: none; border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 14px; }
    #new-session-btn:hover { background: #c73a52; }
    #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 72%; padding: 12px 16px; border-radius: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    .msg.user { align-self: flex-end; background: #0f3460; border-bottom-right-radius: 4px; }
    .msg.assistant { align-self: flex-start; background: #16213e; border: 1px solid #533483; border-bottom-left-radius: 4px; }
    .msg .role { font-size: 12px; color: #888; margin-bottom: 4px; }
    .msg.loading { color: #888; font-style: italic; }
    #input-area { padding: 16px 24px; background: #16213e; border-top: 1px solid #0f3460; display: flex; gap: 12px; }
    #input-area textarea { flex: 1; background: #0f3460; color: #e0e0e0; border: 1px solid #533483; border-radius: 8px; padding: 10px 14px; font-size: 15px; resize: none; height: 44px; font-family: inherit; }
    #input-area textarea:focus { outline: none; border-color: #e94560; }
    #send-btn { background: #e94560; color: #fff; border: none; border-radius: 8px; padding: 0 20px; cursor: pointer; font-size: 15px; font-weight: 600; }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #send-btn:hover:not(:disabled) { background: #c73a52; }

    /* Permission modal */
    #perm-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; }
    #perm-overlay.show { display: flex; }
    #perm-modal { background: #16213e; border: 1px solid #533483; border-radius: 12px; padding: 24px; max-width: 520px; width: 90%; }
    #perm-modal h3 { margin-bottom: 12px; color: #e94560; }
    #perm-modal .tool-info { background: #0f3460; border-radius: 8px; padding: 12px; margin-bottom: 16px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-break: break-all; }
    #perm-modal .btns { display: flex; gap: 12px; justify-content: flex-end; }
    #perm-modal .btns button { padding: 8px 20px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 600; }
    #perm-allow { background: #27ae60; color: #fff; }
    #perm-allow:hover { background: #219a52; }
    #perm-deny { background: #555; color: #fff; }
    #perm-deny:hover { background: #444; }

    /* Tool use indicator */
    .tool-indicator { font-size: 12px; color: #e94560; margin-top: 4px; }
  </style>
</head>
<body>
  <header>
    <h1><span>&#9741;</span> Snail Shell</h1>
    <select id="session-select"><option value="">loading...</option></select>
    <button id="new-session-btn">+ New</button>
  </header>
  <div id="messages"></div>
  <div id="input-area">
    <textarea id="input" placeholder="Type a message..." rows="1"></textarea>
    <button id="send-btn">Send</button>
  </div>

  <!-- Permission modal -->
  <div id="perm-overlay">
    <div id="perm-modal">
      <h3>Permission Request</h3>
      <div id="perm-desc"></div>
      <div class="tool-info" id="perm-detail"></div>
      <div class="btns">
        <button id="perm-deny">Deny</button>
        <button id="perm-allow">Allow</button>
      </div>
    </div>
  </div>

  <script>
    const API = "/api";
    let currentSession = null;
    let ws = null;
    const $messages = document.getElementById("messages");
    const $input = document.getElementById("input");
    const $send = document.getElementById("send-btn");
    const $select = document.getElementById("session-select");
    const $newBtn = document.getElementById("new-session-btn");
    const $permOverlay = document.getElementById("perm-overlay");
    const $permDesc = document.getElementById("perm-desc");
    const $permDetail = document.getElementById("perm-detail");

    let activePermToolUseId = null;

    async function api(method, path, body) {
      const opts = { method, headers: {} };
      if (body) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
      const res = await fetch(API + path, opts);
      if (res.status === 204) return null;
      return res.json();
    }

    function escapeHtml(s) {
      return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    function addMsg(role, content) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.innerHTML = '<div class="role">' + escapeHtml(role) + "</div>" + escapeHtml(content);
      $messages.appendChild(div);
      $messages.scrollTop = $messages.scrollHeight;
      return div;
    }

    // WebSocket connection
    function connectWS(sessionId) {
      if (ws) ws.close();
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(`${proto}//${location.host}/ws?session_id=${sessionId}`);

      let currentAssistantDiv = null;
      let streamingText = "";

      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);

        if (msg.type === "agent_event") {
          const ev = msg.event;
          switch (ev.type) {
            case "text":
              if (!currentAssistantDiv) {
                currentAssistantDiv = addMsg("assistant", "");
                currentAssistantDiv.classList.remove("loading");
              }
              streamingText += ev.content;
              currentAssistantDiv.innerHTML = '<div class="role">assistant</div>' + escapeHtml(streamingText);
              $messages.scrollTop = $messages.scrollHeight;
              break;
            case "tool_use":
              if (currentAssistantDiv) {
                const indicator = document.createElement("div");
                indicator.className = "tool-indicator";
                indicator.textContent = "[using tool: " + ev.name + "]";
                currentAssistantDiv.appendChild(indicator);
              }
              break;
            case "result":
              if (currentAssistantDiv && ev.content) {
                currentAssistantDiv.innerHTML = '<div class="role">assistant</div>' + escapeHtml(ev.content);
              }
              currentAssistantDiv = null;
              streamingText = "";
              $send.disabled = false;
              loadSessions();
              break;
            case "error":
              if (currentAssistantDiv) {
                currentAssistantDiv.textContent = "Error: " + ev.error;
                currentAssistantDiv.classList.remove("loading");
              }
              currentAssistantDiv = null;
              streamingText = "";
              $send.disabled = false;
              break;
            case "permission_required":
              showPermissionDialog(msg.request || ev.request);
              break;
          }
        } else if (msg.type === "permission_required") {
          showPermissionDialog(msg.request);
        } else if (msg.type === "error") {
          addMsg("assistant", "Error: " + msg.error);
          $send.disabled = false;
        }
      };

      ws.onclose = () => {};
    }

    function showPermissionDialog(request) {
      activePermToolUseId = request.tool_use_id;
      $permDesc.textContent = `Agent wants to use "${request.tool_name}". Do you allow this action?`;
      $permDetail.textContent = JSON.stringify(request.tool_input, null, 2);
      $permOverlay.classList.add("show");
    }

    document.getElementById("perm-allow").onclick = async () => {
      $permOverlay.classList.remove("show");
      if (activePermToolUseId) {
        await api("POST", "/permissions/" + activePermToolUseId, { decision: "allow" });
        activePermToolUseId = null;
      }
    };

    document.getElementById("perm-deny").onclick = async () => {
      $permOverlay.classList.remove("show");
      if (activePermToolUseId) {
        await api("POST", "/permissions/" + activePermToolUseId, { decision: "deny" });
        activePermToolUseId = null;
      }
    };

    async function loadSessions() {
      const sessions = await api("GET", "/sessions");
      $select.innerHTML = "";
      if (sessions.length === 0) {
        $select.innerHTML = '<option value="">no sessions</option>';
        return;
      }
      for (const s of sessions) {
        const opt = document.createElement("option");
        opt.value = s.id;
        opt.textContent = s.title || s.id.slice(0, 8);
        $select.appendChild(opt);
      }
      if (!currentSession || !sessions.find(s => s.id === currentSession)) {
        currentSession = sessions[0].id;
      }
      $select.value = currentSession;
    }

    async function loadMessages(sessionId) {
      $messages.innerHTML = "";
      const msgs = await api("GET", "/sessions/" + sessionId + "/messages");
      for (const m of msgs) addMsg(m.role, m.content);
    }

    async function selectSession(id) {
      currentSession = id;
      if (id) {
        await loadMessages(id);
        connectWS(id);
      }
    }

    async function createSession() {
      const title = prompt("Session title (optional):") || undefined;
      const res = await api("POST", "/sessions", { title });
      currentSession = res.id;
      await loadSessions();
      await loadMessages(currentSession);
      connectWS(currentSession);
    }

    async function send() {
      const content = $input.value.trim();
      if (!content) return;
      if (!currentSession) {
        const res = await api("POST", "/sessions", {});
        currentSession = res.id;
        await loadSessions();
        connectWS(currentSession);
      }
      $input.value = "";
      $input.style.height = "44px";
      $send.disabled = true;
      addMsg("user", content);
      addMsg("assistant", "thinking...").classList.add("loading");

      // Send via WebSocket for streaming + permission support
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "send_message", content }));
      } else {
        // Fallback: use HTTP API
        try {
          const res = await api("POST", "/sessions/" + currentSession + "/messages", { content });
          // Remove loading message
          const loadingMsg = $messages.querySelector(".msg.loading");
          if (loadingMsg) loadingMsg.remove();
          addMsg("assistant", res.reply);
        } catch (err) {
          const loadingMsg = $messages.querySelector(".msg.loading");
          if (loadingMsg) {
            loadingMsg.textContent = "Error: " + err.message;
            loadingMsg.classList.remove("loading");
          }
        }
        $send.disabled = false;
        await loadSessions();
      }
    }

    $select.addEventListener("change", () => selectSession($select.value));
    $newBtn.addEventListener("click", createSession);
    $send.addEventListener("click", send);
    $input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });
    $input.addEventListener("input", () => {
      $input.style.height = "44px";
      $input.style.height = Math.min($input.scrollHeight, 120) + "px";
    });

    // init
    (async () => {
      await loadSessions();
      if (!currentSession) {
        const res = await api("POST", "/sessions", {});
        currentSession = res.id;
        await loadSessions();
      }
      await loadMessages(currentSession);
      connectWS(currentSession);
      $input.focus();
    })();
  </script>
</body>
</html>
