<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snail Shell</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111827;
      color: #e5e7eb;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 64px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #243042;
      background: #0f172a;
    }
    header h1 { font-size: 18px; font-weight: 700; }
    header h1 span { color: #f97316; }
    .project-pill {
      font-size: 13px;
      color: #cbd5e1;
      background: #1e293b;
      border: 1px solid #334155;
      padding: 6px 10px;
      border-radius: 999px;
    }
    .app-shell {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr) 340px;
    }
    .sidebar, .context-panel {
      min-height: 0;
      overflow: auto;
      background: #0b1220;
      border-right: 1px solid #1f2937;
    }
    .context-panel {
      border-right: none;
      border-left: 1px solid #1f2937;
    }
    .main-panel {
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #111827;
    }
    .panel-section {
      padding: 18px;
      border-bottom: 1px solid #1f2937;
    }
    .panel-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #94a3b8;
      margin-bottom: 12px;
    }
    .project-list,
    .conversation-list,
    .stage-list,
    .artifact-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .nav-item,
    .conversation-row,
    .stage-card,
    .artifact-card {
      border: 1px solid #243042;
      background: #111827;
      border-radius: 12px;
      padding: 12px;
    }
    .nav-item.active,
    .conversation-row.active,
    .stage-card.active {
      border-color: #f97316;
      background: #172033;
    }
    .pending-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      background: #f59e0b;
      color: #111827;
      font-size: 12px;
      font-weight: 700;
    }
    .nav-item button,
    .conversation-row button,
    button {
      width: 100%;
      background: transparent;
      color: inherit;
      text-align: left;
      border: none;
      font: inherit;
      cursor: pointer;
    }
    .name { font-weight: 600; margin-bottom: 4px; }
    .meta { font-size: 12px; color: #94a3b8; }
    .workspace-header {
      padding: 18px 20px;
      border-bottom: 1px solid #1f2937;
      background: #0f172a;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }
    .workspace-header h2 { font-size: 20px; margin-bottom: 6px; }
    .breadcrumbs { font-size: 12px; color: #94a3b8; }
    .boss-mentions-banner {
      display: none;
      margin: 16px 24px 0;
      padding: 14px;
      border: 1px solid rgba(251, 191, 36, 0.35);
      border-radius: 14px;
      background: rgba(120, 53, 15, 0.18);
    }
    .boss-mentions-banner.visible {
      display: block;
    }
    .boss-mention-item {
      width: 100%;
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid #475569;
      color: #e5e7eb;
      text-align: left;
    }
    .msg.jump-highlight {
      box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.8);
      transition: box-shadow 160ms ease;
    }
    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 78%;
      padding: 12px 14px;
      border-radius: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #1d4ed8;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #172554;
      border: 1px solid #1d4ed8;
      border-bottom-left-radius: 4px;
    }
    .msg .role {
      font-size: 11px;
      color: #bfdbfe;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .msg.loading {
      color: #94a3b8;
      font-style: italic;
      border-style: dashed;
      background: rgba(15, 23, 42, 0.92);
    }
    .msg.question {
      max-width: min(78%, 760px);
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.96), rgba(15, 23, 42, 0.9));
      border: 1px solid rgba(96, 165, 250, 0.24);
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.36);
    }
    .msg.assistant.result-shell {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: linear-gradient(180deg, rgba(23, 37, 84, 0.96), rgba(15, 23, 42, 0.96));
    }
    .assistant-part {
      white-space: pre-wrap;
      word-break: break-word;
    }
    .assistant-part .mention {
      color: #60a5fa;
      font-weight: 500;
      background: rgba(96, 165, 250, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .stream-summary {
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.72);
      overflow: hidden;
    }
    .stream-summary summary {
      cursor: pointer;
      list-style: none;
      padding: 10px 12px;
      color: #bfdbfe;
      font-size: 12px;
      font-weight: 600;
      user-select: none;
    }
    .stream-summary summary::-webkit-details-marker {
      display: none;
    }
    .stream-summary summary::before {
      content: ">";
      display: inline-block;
      margin-right: 8px;
      transition: transform 140ms ease;
    }
    .stream-summary[open] summary::before {
      transform: rotate(90deg);
    }
    .stream-summary-content {
      padding: 0 12px 12px;
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.65;
      white-space: pre-wrap;
    }
    .final-result {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .final-result-label {
      color: #93c5fd;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .question-title {
      margin-bottom: 8px;
      font-size: 16px;
      font-weight: 700;
      color: #eff6ff;
    }
    .question-body {
      color: #dbeafe;
      margin-bottom: 10px;
    }
    .question-reason {
      margin-bottom: 14px;
      padding: 10px 12px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 12px;
      background: rgba(30, 41, 59, 0.56);
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.5;
    }
    .question-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .question-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 2px;
    }
    .question-selection-hint {
      color: #93c5fd;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .question-selection-count {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.14);
      border: 1px solid rgba(96, 165, 250, 0.24);
      color: #bfdbfe;
      font-size: 12px;
      font-weight: 600;
    }
    .question-options {
      display: grid;
      gap: 10px;
    }
    .question-option {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.72);
      transition: border-color 140ms ease, background 140ms ease, transform 140ms ease, box-shadow 140ms ease;
    }
    .question-option:hover {
      border-color: rgba(96, 165, 250, 0.5);
      background: rgba(30, 41, 59, 0.9);
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.22);
    }
    .question-option-label {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      cursor: pointer;
    }
    .question-option input {
      width: 18px;
      height: 18px;
      margin: 2px 0 0;
      accent-color: #60a5fa;
    }
    .question-option-title {
      color: #f8fafc;
      font-weight: 600;
      line-height: 1.4;
    }
    .question-option-description {
      margin-top: 4px;
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.5;
    }
    .question-option-extra {
      margin-left: 30px;
      display: none;
      border-color: rgba(96, 165, 250, 0.18);
      background: rgba(15, 23, 42, 0.9);
    }
    .question-option:has(input:checked) {
      border-color: rgba(96, 165, 250, 0.72);
      background: linear-gradient(180deg, rgba(30, 64, 175, 0.18), rgba(15, 23, 42, 0.84));
      box-shadow: 0 12px 26px rgba(37, 99, 235, 0.18);
    }
    .question-option:has(input:checked) .question-option-extra {
      display: block;
    }
    .question-actions {
      margin-top: 4px;
      justify-content: flex-end;
    }
    .question-submit {
      min-width: 112px;
    }
    .question-submit[disabled] {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .tool-indicator { margin-top: 8px; font-size: 12px; color: #fbbf24; }
    .composer {
      border-top: 1px solid #1f2937;
      padding: 16px 20px 20px;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .reply-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid #334155;
      border-radius: 12px;
      background: rgba(30, 41, 59, 0.7);
      color: #cbd5e1;
      font-size: 13px;
    }
    .reply-banner.visible {
      display: flex;
    }
    .reply-banner strong {
      color: #93c5fd;
    }
    .reply-cancel {
      width: auto;
      color: #94a3b8;
      padding: 0;
    }
    .msg-actions {
      margin-top: 8px;
      display: flex;
      gap: 10px;
    }
    .msg-action {
      width: auto;
      color: #93c5fd;
      font-size: 12px;
    }
    .quote-block {
      margin-bottom: 8px;
      padding: 8px 10px;
      border-left: 3px solid #60a5fa;
      background: rgba(15, 23, 42, 0.55);
      border-radius: 8px;
      color: #cbd5e1;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    textarea, input, select {
      width: 100%;
      background: #111827;
      color: #e5e7eb;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
    }
    textarea { resize: vertical; }
    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .composer-hints {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .mention-status {
      min-height: 18px;
      font-size: 12px;
      color: #94a3b8;
    }
    .mention-status.error {
      color: #fca5a5;
    }
    .mention-status.info {
      color: #93c5fd;
    }
    .mention-suggestions {
      display: none;
      flex-direction: column;
      gap: 6px;
      padding: 10px;
      border: 1px solid #334155;
      border-radius: 12px;
      background: #0b1220;
    }
    .mention-suggestions.visible {
      display: flex;
    }
    .mention-suggestion {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px 12px;
      border: 1px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      background: rgba(15, 23, 42, 0.8);
    }
    .mention-suggestion.active {
      border-color: #60a5fa;
      background: rgba(30, 41, 59, 0.95);
    }
    .mention-suggestion-title {
      font-size: 13px;
      font-weight: 600;
      color: #eff6ff;
    }
    .mention-suggestion-meta {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
    }
    .primary-button,
    .secondary-button,
    .ghost-button {
      width: auto;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 600;
    }
    .primary-button { background: #f97316; color: white; }
    .secondary-button { background: #2563eb; color: white; }
    .ghost-button { background: #1f2937; color: #e5e7eb; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #1f2937;
      color: #cbd5e1;
    }
    .badge.in_progress { background: #1e3a8a; color: #dbeafe; }
    .badge.in_review { background: #78350f; color: #fef3c7; }
    .badge.approved { background: #14532d; color: #dcfce7; }
    .badge.rejected, .badge.cancelled { background: #7f1d1d; color: #fee2e2; }
    .artifact-card pre {
      margin-top: 8px;
      background: #0b1220;
      border-radius: 8px;
      padding: 10px;
      white-space: pre-wrap;
      font-size: 12px;
      color: #cbd5e1;
      max-height: 180px;
      overflow: auto;
    }
    .dispatch-group {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.6);
    }
    .dispatch-group .name {
      font-weight: 600;
      color: #e5e7eb;
    }
    .dispatch-preview {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #334155;
      font-size: 12px;
      color: #cbd5e1;
      white-space: pre-wrap;
    }
    .empty-state { color: #94a3b8; font-size: 13px; padding: 8px 0; }
    .small-label { display: block; margin-bottom: 6px; font-size: 12px; color: #94a3b8; }
    @media (max-width: 960px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar, .context-panel { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1><span>Snail</span> Shell</h1>
    <div class="project-pill" id="top-project-state">未选择项目</div>
  </header>
  <div id="app-notice" style="display:none; padding:10px 20px; background:#1d4ed8; color:white; font-size:13px;"></div>

  <div class="app-shell">
    <aside class="sidebar">
      <section class="panel-section">
        <div class="panel-title">Projects</div>
        <div class="button-row" style="margin-bottom: 12px;">
          <button class="primary-button" id="new-project-btn">新建项目</button>
        </div>
        <div class="project-list" id="project-list"></div>
      </section>

      <section class="panel-section">
        <div class="panel-title">Conversations</div>
        <div class="button-row" style="margin-bottom: 12px;">
          <button class="secondary-button" id="new-conversation-btn">新建对话</button>
        </div>
        <div class="conversation-list" id="conversation-list"></div>
      </section>
    </aside>

    <main class="main-panel">
      <div class="workspace-header">
        <div>
          <h2 id="conversation-title">未选择对话</h2>
          <div class="breadcrumbs" id="conversation-breadcrumbs">请选择一个项目。</div>
        </div>
        <div id="workspace-stage-badge" class="badge">无活跃阶段</div>
      </div>

      <div id="boss-mentions-banner" class="boss-mentions-banner"></div>

      <div id="messages"></div>

      <div class="composer">
        <div id="reply-banner" class="reply-banner">
          <div id="reply-banner-text"></div>
          <button type="button" id="reply-cancel" class="reply-cancel">取消</button>
        </div>
        <textarea id="input" placeholder="输入 @Design Snail 与指定 snail 对话；未指定时默认发送给当前主 snail" rows="2"></textarea>
        <div class="composer-hints">
          <div id="mention-status" class="mention-status"></div>
          <div id="mention-suggestions" class="mention-suggestions"></div>
        </div>
        <div class="button-row">
          <button class="primary-button" id="send-btn">发送</button>
        </div>
      </div>
    </main>

    <aside class="context-panel">
      <section class="panel-section">
        <div class="panel-title">Stage Chain</div>
        <div class="button-row" style="margin-bottom: 12px;">
          <button class="ghost-button" id="next-stage-btn">推进到下一阶段</button>
        </div>
        <div class="stage-list" id="stage-list"></div>
        <div id="stage-contract" style="margin-top: 14px;"></div>
      </section>

      <section class="panel-section">
        <div class="panel-title">Artifacts</div>
        <label class="small-label" for="artifact-type">Artifact Type</label>
        <select id="artifact-type"></select>
        <label class="small-label" for="artifact-title" style="margin-top: 10px;">标题</label>
        <input id="artifact-title" placeholder="artifact 标题">
        <label class="small-label" for="artifact-content" style="margin-top: 10px;">内容</label>
        <textarea id="artifact-content" rows="6" placeholder="artifact 内容"></textarea>
        <div class="button-row" style="margin-top: 12px; margin-bottom: 14px;">
          <button class="secondary-button" id="create-artifact-btn">创建 Artifact</button>
          <button class="ghost-button" id="set-formal-artifact-btn">设为正式交付</button>
        </div>
        <div class="artifact-list" id="artifact-list"></div>
      </section>

      <section class="panel-section">
        <div class="panel-title">Bus State</div>
        <div id="dispatch-state-list"></div>
      </section>
    </aside>
  </div>

  <script>
    const API = "/api";
    let STAGE_DEFINITIONS = {};

    const state = {
      projects: [],
      currentProject: null,
      stages: [],
      currentStage: null,
      conversations: [],
      currentConversation: null,
      artifacts: [],
      artifactDefinitions: {},
      snails: [],
      ws: null,
      currentMessages: [],
      dispatchState: null,
      activeBossMentions: [],
      selectedFormalArtifactIds: new Set(),
      replyToMessage: null,
    };

    const $projectList = document.getElementById("project-list");
    const $conversationList = document.getElementById("conversation-list");
    const $messages = document.getElementById("messages");
    const $bossMentionsBanner = document.getElementById("boss-mentions-banner");
    const $input = document.getElementById("input");
    const $send = document.getElementById("send-btn");
    const $conversationTitle = document.getElementById("conversation-title");
    const $conversationBreadcrumbs = document.getElementById("conversation-breadcrumbs");
    const $workspaceStageBadge = document.getElementById("workspace-stage-badge");
    const $topProjectState = document.getElementById("top-project-state");
    const $appNotice = document.getElementById("app-notice");
    const $stageList = document.getElementById("stage-list");
    const $stageContract = document.getElementById("stage-contract");
    const $artifactList = document.getElementById("artifact-list");
    const $artifactType = document.getElementById("artifact-type");
    const $artifactTitle = document.getElementById("artifact-title");
    const $artifactContent = document.getElementById("artifact-content");
    const $dispatchStateList = document.getElementById("dispatch-state-list");
    const $mentionStatus = document.getElementById("mention-status");
    const $mentionSuggestions = document.getElementById("mention-suggestions");
    const $replyBanner = document.getElementById("reply-banner");
    const $replyBannerText = document.getElementById("reply-banner-text");
    const $replyCancel = document.getElementById("reply-cancel");

    const mentionState = {
      active: false,
      start: -1,
      end: -1,
      query: "",
      suggestions: [],
      selectedIndex: 0,
      selectedMentions: [],
    };

    function stageTitle(type) {
      return STAGE_DEFINITIONS[type]?.title || type;
    }

    function artifactTitle(type) {
      return state.artifactDefinitions[type]?.title || type;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function getAvailableSnailsForCurrentConversation() {
      if (!state.currentConversation) return [];
      const names = Array.isArray(state.currentConversation.participating_snails)
        ? state.currentConversation.participating_snails
        : [];
      return names
        .map((name) => state.snails.find((item) => item.name === name))
        .filter(Boolean);
    }

    function setMentionStatus(message = "", kind = "") {
      $mentionStatus.textContent = message;
      $mentionStatus.className = `mention-status${kind ? ` ${kind}` : ""}`;
    }

    function hideMentionSuggestions() {
      mentionState.active = false;
      mentionState.start = -1;
      mentionState.end = -1;
      mentionState.query = "";
      mentionState.suggestions = [];
      mentionState.selectedIndex = 0;
      $mentionSuggestions.className = "mention-suggestions";
      $mentionSuggestions.innerHTML = "";
    }

    function clearInvalidMentionRanges() {
      mentionState.selectedMentions = mentionState.selectedMentions.filter((mention) => {
        const current = $input.value.slice(mention.start, mention.end);
        return current === mention.raw;
      });
    }

    function renderMentionSuggestions() {
      if (!mentionState.active || !mentionState.suggestions.length) {
        $mentionSuggestions.className = "mention-suggestions";
        $mentionSuggestions.innerHTML = "";
        return;
      }

      $mentionSuggestions.className = "mention-suggestions visible";
      $mentionSuggestions.innerHTML = mentionState.suggestions.map((snail, index) => `
        <button type="button" class="mention-suggestion${index === mentionState.selectedIndex ? " active" : ""}" data-mention-index="${index}">
          <div class="mention-suggestion-title">@${escapeHtml(snail.name)}</div>
          <div class="mention-suggestion-meta">${escapeHtml(snail.description || "")}</div>
        </button>
      `).join("");

      Array.from($mentionSuggestions.querySelectorAll("[data-mention-index]"))
        .forEach((button) => {
          button.addEventListener("mousedown", (event) => {
            event.preventDefault();
            applyMentionSuggestion(Number(button.getAttribute("data-mention-index")));
          });
        });
    }

    function updateMentionComposer() {
      const availableSnails = getAvailableSnailsForCurrentConversation();
      const value = $input.value;
      const caret = $input.selectionStart ?? value.length;
      const mentionStart = value.lastIndexOf("@", caret - 1);

      if (mentionStart === -1) {
        hideMentionSuggestions();
        setMentionStatus(availableSnails.length ? `可 @ ${availableSnails.map((item) => item.name).join(" / ")}` : "");
        return;
      }

      const prefix = value.slice(0, mentionStart);
      if (prefix && !/[\s\n]$/.test(prefix)) {
        hideMentionSuggestions();
        setMentionStatus(availableSnails.length ? `可 @ ${availableSnails.map((item) => item.name).join(" / ")}` : "");
        return;
      }

      const tail = value.slice(mentionStart + 1);
      const segment = tail.split("\n")[0];
      const typedUntilCaret = value.slice(mentionStart + 1, caret);
      const query = typedUntilCaret.trim();
      const matches = availableSnails.filter((snail) => snail.name.toLowerCase().includes(query.toLowerCase()));

      mentionState.active = true;
      mentionState.start = mentionStart;
      mentionState.end = mentionStart + 1 + segment.length;
      mentionState.query = query;
      mentionState.suggestions = matches;
      mentionState.selectedIndex = Math.min(mentionState.selectedIndex, Math.max(matches.length - 1, 0));

      if (matches.length) {
        setMentionStatus("选择一个 snail 作为当前消息目标", "info");
        renderMentionSuggestions();
        return;
      }

      renderMentionSuggestions();
      setMentionStatus(query ? "继续输入或将其作为普通文本发送" : "继续输入以搜索当前 conversation 中可用的 snail", "info");
    }

    function applyMentionSuggestion(index) {
      const snail = mentionState.suggestions[index];
      if (!snail) return;
      const before = $input.value.slice(0, mentionState.start);
      const after = $input.value.slice(mentionState.end).replace(/^\s*/, "");
      const nextValue = `${before}@${snail.name}${after ? ` ${after}` : " "}`;
      $input.value = nextValue;
      mentionState.selectedMentions = mentionState.selectedMentions.filter((mention) => mention.end <= mentionState.start || mention.start >= mentionState.end);
      mentionState.selectedMentions.push({
        start: before.length,
        end: before.length + `@${snail.name}`.length,
        raw: `@${snail.name}`,
        snail,
      });
      const nextCaret = `${before}@${snail.name} `.length;
      $input.focus();
      $input.setSelectionRange(nextCaret, nextCaret);
      hideMentionSuggestions();
      setMentionStatus(`当前将发给 ${snail.name}`, "info");
    }

    async function api(method, path, body) {
      const options = { method, headers: {} };
      if (body) {
        options.headers["Content-Type"] = "application/json";
        options.body = JSON.stringify(body);
      }
      const response = await fetch(API + path, options);
      const data = response.status === 204 ? null : await response.json();
      if (!response.ok) {
        throw new Error(data?.error || data?.message || "Request failed");
      }
      return data;
    }

      clearTimeout(showNotice._timer);

    }

    function appendMessageActions(node, message) {

    function createQuoteBlock(message) {
      const block = document.createElement("div");
      block.className = "quote-block";

      if (!message?.reply_to_message_id) return null;
      const referenced = (state.currentMessages || []).find((item) => item.id === message.reply_to_message_id);
      if (!referenced) return null;
      block.textContent = `${referenced.producer_snail || referenced.role}: ${summarizeMessage(referenced) || "(空消息)"}`;

    function removeLoadingMessage() {
      const loading = $messages.querySelector(".msg.assistant.loading");
      if (loading) loading.remove();
    }

    function ensureAssistantLoadingShell(speaker) {
      removeLoadingMessage();
      const shell = addMsg("assistant", "thinking...", speaker || "assistant");
      shell.classList.add("loading");
      return shell;
    }

    function tryParseStructuredText(content) {
      const trimmed = String(content || "").trim();
      if (!trimmed.startsWith("{") || !trimmed.endsWith("}")) return null;
      try {
        return JSON.parse(trimmed);
      } catch {
        return null;
      }
    }

    function partText(part) {
      if (!part) return "";
      return part.text_value || "";
    }

    function joinParts(parts, types) {
      return (parts || [])
        .filter((part) => types.includes(part.part_type))
        .map((part) => partText(part))
        .filter(Boolean)
        .join("\n\n");
    }

    function formatStructuredMessageContent(message, textPart) {
      const payload = textPart ? tryParseStructuredText(partText(textPart)) : null;
      if (!payload) return partText(textPart) || "";
      if (payload.type === "question") return null;
      if (payload.type === "question_response") return payload.summary || partText(textPart) || "";
      return partText(textPart) || "";
    }

    function formatStructuredTextContent(content) {
      const payload = tryParseStructuredText(content);
      if (!payload) return content || "";
      if (payload.type === "question") return null;
      if (payload.type === "question_response") return payload.summary || content || "";
      return content || "";
    }

    function parseStructuredMessageParts(content) {
      if (!content || typeof content !== "string") return null;
      const trimmed = content.trim();
      if (!trimmed.startsWith("[") || !trimmed.endsWith("]")) return null;
      try {
        const parsed = JSON.parse(trimmed);
        if (!Array.isArray(parsed)) return null;
        if (parsed.length === 0) return null;
        if (!parsed.every((item) => item && typeof item === "object" && "part_type" in item)) return null;
        return parsed;
      } catch {
        return null;
      }
    }

    function renderStructuredMessageParts(parts) {
      return parts
        .map((part) => {
          if (part.part_type === "content") {
            return escapeHtml(part.text_value || "");
          }
          return "";
        })
        .join("");
    }

    function formatDisplayTextContent(content) {
      const structuredParts = parseStructuredMessageParts(content);
      if (structuredParts) {
        return renderStructuredMessageParts(structuredParts);
      }
      const formatted = formatStructuredTextContent(content);
      if (!formatted) return formatted;
      if (formatted.startsWith("[system] ")) {
        return escapeHtml(formatted.slice("[system] ".length));
      }
      return escapeHtml(formatted);
    }

    function formatStreamPart(part) {
      if (part.part_type === "content" || part.part_type === "streaming_chunk") {
        const textContent = partText(part);
        return escapeHtml(textContent) || "";
      }
      if (part.part_type === "tool_use") {
        try {
          const payload = JSON.parse(part.json_value || "{}");
          return formatToolUseLabel(payload.name, payload.summary, payload.detail);
        } catch {
          return `[using tool]`;
        }
      }
      return "";
    }

    function renderStreamParts(parts) {
      return parts
        .filter((part) => part.part_type === "content" || part.part_type === "streaming_chunk" || part.part_type === "tool_use")
        .map((part) => formatStreamPart(part))
        .filter(Boolean)
        .join("");
    }

    function createAssistantResultShell(speaker) {
      const wrapper = document.createElement("div");
      wrapper.className = "msg assistant result-shell";
      wrapper.innerHTML = '<div class="role">' + escapeHtml(speaker || "assistant") + '</div>';
      $messages.appendChild(wrapper);
      $messages.scrollTop = $messages.scrollHeight;
      return wrapper;
    }

    function renderAssistantHistoryMessage(message) {
      const parts = message.parts || [];
      const contentParts = parts.filter((part) => part.part_type === "content");
      const streamingChunks = parts.filter((part) => part.part_type === "streaming_chunk");
      const toolUseParts = parts.filter((part) => part.part_type === "tool_use");

      // Check if the content is a question
      if (contentParts.length === 1) {
        const payload = tryParseStructuredText(partText(contentParts[0]));
        if (payload?.type === "question") {
          const shell = document.createElement("div");
          shell.className = "msg assistant question";
          const quoteBlock = createQuoteBlock(message);
          if (quoteBlock) shell.appendChild(quoteBlock);
          shell.appendChild(buildQuestionMessage(payload, `history-text-${message.id}`));
          appendMessageActions(shell, message);
          $messages.appendChild(shell);
          $messages.scrollTop = $messages.scrollHeight;
          return;
        }
      }

      // Render with streaming structure: streaming_chunk in <details>, content in final-result
      const hasStreamingChunks = streamingChunks.length > 0;
      const hasFinalContent = contentParts.length > 0;
      const hasToolUse = toolUseParts.length > 0;

      if (hasStreamingChunks || hasFinalContent || hasToolUse) {
        const shell = document.createElement("div");
        shell.className = "msg assistant result-shell";
        shell.innerHTML = '<div class="role">' + escapeHtml(message.producer_snail || message.role) + '</div>';

        const quoteBlock = createQuoteBlock(message);
        if (quoteBlock) shell.appendChild(quoteBlock);

        // Render streaming chunks as collapsible details
        if (hasStreamingChunks) {
          const streamedText = streamingChunks.map((part) => escapeHtml(partText(part))).join("\n");
          const details = document.createElement("details");
          details.className = "stream-summary";
          details.innerHTML = `
            <summary>查看流式过程</summary>
            <div class="stream-summary-content">${streamedText}</div>
          `;
          shell.appendChild(details);
        }

        // Render tool use
        if (hasToolUse) {
          toolUseParts.forEach((part) => {
            try {
              const payload = JSON.parse(part.json_value || "{}");
              const toolLabel = formatToolUseLabel(payload.name, payload.summary, payload.detail);
              const toolBlock = document.createElement("div");
              toolBlock.className = "assistant-part";
              toolBlock.textContent = toolLabel;
              shell.appendChild(toolBlock);
            } catch {
              // ignore malformed tool_use
            }
          });
        }

        // Render final content
        if (hasFinalContent) {
          const finalContent = contentParts.map((part) => partText(part)).join("\n");
          const payload = tryParseStructuredText(finalContent);
          if (payload?.type === "question") {
            shell.appendChild(buildQuestionMessage(payload, `history-text-${message.id}`));
          } else {
            const finalResultContent = formatDisplayTextContent(finalContent);
            if (finalResultContent !== null && finalResultContent !== "") {
              const resultBlock = document.createElement("div");
              resultBlock.className = "final-result";
              resultBlock.innerHTML = `
                <div class="final-result-label">Final</div>
                <div class="assistant-part">${finalResultContent}</div>
              `;
              shell.appendChild(resultBlock);
            }
          }
        }

        markMessageNode(shell, message.id);
        appendMessageActions(shell, message);
        $messages.appendChild(shell);
        $messages.scrollTop = $messages.scrollHeight;
      }
    }

    function appendStreamingTextPart(content) {
      appendStreamingPart(content);
    }

    function appendStreamingToolUse(name, summary, detail) {
      appendStreamingPart(formatToolUseLabel(name, summary, detail));
    }

    function formatToolUseLabel(name, summary, detail) {
      const label = summary || `[using tool: ${name || "unknown"}]`;
      return detail ? `${label}
  ${detail}` : label;
    }

    function appendStreamingPart(content) {
      if (!state.ws.streamShell) {
        const shell = createAssistantResultShell(state.ws.activeSnailName);
        const streamBlock = document.createElement("div");
        streamBlock.className = "assistant-part";
        shell.appendChild(streamBlock);
        state.ws.streamShell = shell;
        state.ws.streamContainer = streamBlock;
      }
      state.ws.streamedParts.push(content);
      state.ws.streamContainer.textContent = state.ws.streamedParts.join("\n");
      $messages.scrollTop = $messages.scrollHeight;
    }

    function finalizeStreamingResult(content) {
      const streamedText = (state.ws.streamedParts || []).join("\n");
      let shell = state.ws.streamShell;
      if (!shell) shell = createAssistantResultShell(state.ws.activeSnailName);
      if (state.ws.streamContainer) state.ws.streamContainer.remove();
      shell.querySelectorAll(".stream-summary, .final-result, .msg.question").forEach((node) => node.remove());

      if (streamedText) {
        const details = document.createElement("details");
        details.className = "stream-summary";
        details.innerHTML = `
          <summary>查看流式过程</summary>
          <div class="stream-summary-content">${escapeHtml(streamedText)}</div>
        `;
        shell.appendChild(details);
      }

      const payload = tryParseStructuredText(content);
      if (payload?.type === "question") {
        shell.appendChild(buildQuestionMessage(payload, `result-${Date.now()}`));
      } else {
        const finalResultContent = formatDisplayTextContent(content);
        if (finalResultContent !== null && finalResultContent !== "") {
          const resultBlock = document.createElement("div");
          resultBlock.className = "final-result";
          resultBlock.innerHTML = `
            <div class="final-result-label">Final</div>
            <div class="assistant-part">${finalResultContent}</div>
          `;
          shell.appendChild(resultBlock);
        }
      }

      state.ws.streamShell = null;
      state.ws.streamContainer = null;
      state.ws.streamedParts = [];
      state.ws.activeSnailName = null;
      $messages.scrollTop = $messages.scrollHeight;
    }

    function buildQuestionMessage(payload, messageKey) {
      const wrapper = document.createElement("div");
      wrapper.className = "question";
      const options = Array.isArray(payload.options) ? payload.options : [];
      const selectionType = payload.selection_mode === "multiple" ? "checkbox" : "radio";
      const inputName = `question-${messageKey}`;
      const selectionHint = payload.selection_mode === "multiple" ? "可多选" : "单选";
      wrapper.innerHTML = `
        <div class="question-title">${escapeHtml(payload.title || "需要你的确认")}</div>
        <div class="question-body">${escapeHtml(payload.question || "")}</div>
        ${payload.reason ? `<div class="question-reason">${escapeHtml(payload.reason)}</div>` : ""}
        <form class="question-form"></form>
      `;
      const form = wrapper.querySelector(".question-form");
      const toolbar = document.createElement("div");
      toolbar.className = "question-toolbar";
      toolbar.innerHTML = `
        <div class="question-selection-hint">${selectionHint}</div>
        <div class="question-selection-count">尚未选择</div>
      `;
      form.appendChild(toolbar);

      const optionsContainer = document.createElement("div");
      optionsContainer.className = "question-options";
      options.forEach((option, index) => {
        const optionId = `q-${messageKey}-${index}`;
        const item = document.createElement("div");
        item.className = "question-option";
        item.innerHTML = `
          <label class="question-option-label" for="${optionId}">
            <input id="${optionId}" type="${selectionType}" name="${inputName}" value="${escapeHtml(option.key)}">
            <div>
              <div class="question-option-title">${escapeHtml(option.label)}</div>
              ${option.description ? `<div class="question-option-description">${escapeHtml(option.description)}</div>` : ""}
            </div>
          </label>
          ${option.allow_text_input ? `<textarea class="question-option-extra" data-option-text="${escapeHtml(option.key)}" rows="2" placeholder="${escapeHtml(option.text_input_placeholder || option.text_input_label || "补充说明")}"></textarea>` : ""}
        `;
        optionsContainer.appendChild(item);
      });
      form.appendChild(optionsContainer);

      const actionRow = document.createElement("div");
      actionRow.className = "button-row question-actions";
      actionRow.innerHTML = `<button type="submit" class="secondary-button question-submit" disabled>提交回答</button>`;
      form.appendChild(actionRow);

      const countBadge = form.querySelector(".question-selection-count");
      const submitButton = form.querySelector(".question-submit");

      function syncQuestionSelectionState() {
        const selectedInputs = Array.from(form.querySelectorAll(`input[name="${inputName}"]:checked`));
        const selectedCount = selectedInputs.length;
        countBadge.textContent = selectedCount
          ? (payload.selection_mode === "multiple" ? `已选 ${selectedCount} 项` : "已选择")
          : "尚未选择";
        submitButton.disabled = selectedCount === 0;

        Array.from(form.querySelectorAll(`input[name="${inputName}"]`)).forEach((input) => {
          const optionCard = input.closest(".question-option");
          if (!optionCard) return;
          optionCard.setAttribute("aria-selected", input.checked ? "true" : "false");
        });
      }

      form.addEventListener("change", (event) => {
        const target = event.target;
        if (!(target instanceof HTMLInputElement) || target.name !== inputName) return;
        syncQuestionSelectionState();
      });

      syncQuestionSelectionState();

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const selectedInputs = Array.from(form.querySelectorAll(`input[name="${inputName}"]:checked`));
        if (!selectedInputs.length) {
          showNotice("请先选择一个或多个选项", true);
          return;
        }
        submitButton.disabled = true;
        submitButton.textContent = "提交中...";
        const selectedOptions = selectedInputs.map((input) => {
          const option = options.find((item) => item.key === input.value);
          const textArea = form.querySelector(`textarea[data-option-text="${CSS.escape(input.value)}"]`);
          return {
            key: option?.key || input.value,
            label: option?.label || input.value,
            extra_text: textArea ? textArea.value.trim() : "",
          };
        });
        const summary = selectedOptions.map((option) => `${option.label}${option.extra_text ? `（${option.extra_text}）` : ""}`).join("；");
        const responsePayload = {
          type: "question_response",
          response_to: {
            title: payload.title || "",
          },
          selection_mode: payload.selection_mode || "single",
          selected_options: selectedOptions,
          summary,
        };
        try {
          await sendStructuredResponse(summary, responsePayload);
        } finally {
          submitButton.textContent = "提交回答";
          syncQuestionSelectionState();
        }
      });

      return wrapper;
    }

    function renderQuestionMessage(message) {
      const textPart = (message.parts || []).find((part) => part.part_type === "content");
      const payload = textPart ? tryParseStructuredText(partText(textPart)) : null;
      if (!payload) {
        const shell = markMessageNode(addMsg(message.role, partText(textPart) || "", message.producer_snail || message.role), message.id);
        const quoteBlock = createQuoteBlock(message);
        if (quoteBlock) shell.insertBefore(quoteBlock, shell.children[1] || null);
        appendMessageActions(shell, message);
        return;
      }

      const shell = document.createElement("div");
      shell.className = "msg assistant question";
      markMessageNode(shell, message.id);
      const quoteBlock = createQuoteBlock(message);
      if (quoteBlock) shell.appendChild(quoteBlock);
      shell.appendChild(buildQuestionMessage(payload, message.id));
      appendMessageActions(shell, message);
      $messages.appendChild(shell);
      $messages.scrollTop = $messages.scrollHeight;
    }

    function renderQuestionPayload(payload) {
      const shell = document.createElement("div");
      shell.className = "msg assistant question";
      shell.appendChild(buildQuestionMessage(payload, `live-${Date.now()}`));

      $messages.appendChild(shell);
      $messages.scrollTop = $messages.scrollHeight;
      return shell;
    }

    function renderHeader() {
      if (!state.currentProject) {
        $topProjectState.textContent = "未选择项目";
        $conversationTitle.textContent = "未选择对话";
        $conversationBreadcrumbs.textContent = "请选择一个项目。";
        $workspaceStageBadge.textContent = "无活跃阶段";
        $workspaceStageBadge.className = "badge";
        return;
      }
      const stageLabel = state.currentStage ? stageTitle(state.currentStage.type) : "无阶段";
      $topProjectState.textContent = `${state.currentProject.name} · ${stageLabel}`;
      $conversationTitle.textContent = state.currentConversation ? state.currentConversation.title : state.currentProject.name;
      $conversationBreadcrumbs.textContent = state.currentConversation
        ? `${state.currentProject.name} / ${stageLabel} / ${state.currentConversation.default_snail}${state.currentConversation.participating_snails?.length ? ` / ${state.currentConversation.participating_snails.join(", ")}` : ""}`
        : `${state.currentProject.name} / ${stageLabel}`;
      $workspaceStageBadge.textContent = state.currentStage ? `${stageLabel} · ${state.currentStage.status}` : "无活跃阶段";
      $workspaceStageBadge.className = "badge" + (state.currentStage ? ` ${state.currentStage.status}` : "");
    }

    function renderStages() {
      $stageList.innerHTML = "";
      if (state.stages.length === 0) {
        $stageList.innerHTML = '<div class="empty-state">暂无阶段</div>';
        return;
      }
      state.stages.forEach((stage) => {
        const card = document.createElement("div");
        card.className = "stage-card" + (state.currentStage && stage.id === state.currentStage.id ? " active" : "");
        const formal = Array.isArray(stage.formal_artifacts) ? stage.formal_artifacts.length : 0;
        const badge = stage.boss_pending_count > 0 ? `<span class="pending-badge">@${stage.boss_pending_count}</span>` : "";
        card.innerHTML = `
          <div class="name" style="display:flex; align-items:center; justify-content:space-between; gap:8px;"><span>${escapeHtml(stageTitle(stage.type))} #${stage.sequence}</span>${badge}</div>
          <div class="badge ${escapeHtml(stage.status)}">${escapeHtml(stage.status)}</div>
          <div class="meta" style="margin-top: 8px;">正式交付数: ${formal}</div>
        `;
        card.addEventListener("click", async () => {
          state.currentStage = stage;
          await loadStageConversations(stage.id);
          await loadStageArtifacts(stage.id);
          renderHeader();
          renderStages();
          renderArtifactTypeOptions();
        });
        $stageList.appendChild(card);
      });
      renderStageContract();
    }

    function renderStageContract() {
      $stageContract.innerHTML = "";
      if (!state.currentStage) {
        return;
      }
      const definition = STAGE_DEFINITIONS[state.currentStage.type];
      if (!definition) {
        return;
      }
      const stageSnailNames = Array.isArray(definition.snails) ? definition.snails : [];
      const primarySnailName = stageSnailNames[0] || "";
      const snailCards = stageSnailNames.map((snailName) => {
        const snail = state.snails.find((item) => item.name === snailName);
        const isPrimary = snailName === primarySnailName;
        if (!snail) {
          return `<div class="artifact-card" style="margin-top: 10px;"><div class="name">${escapeHtml(snailName)}${isPrimary ? " (主 snail)" : ""}</div></div>`;
        }
        const principles = Array.isArray(snail.system_prompt?.principles)
          ? snail.system_prompt.principles.map((item) => `<li>${escapeHtml(item)}</li>`).join("")
          : "";
        const workingRules = Array.isArray(snail.working_rules)
          ? snail.working_rules.map((item) => `<li>${escapeHtml(item)}</li>`).join("")
          : "";
        const preferredArtifacts = Array.isArray(snail.preferred_artifact_types)
          ? snail.preferred_artifact_types.join(", ")
          : "";
        return `
          <div class="artifact-card" style="margin-top: 10px;">
            <div class="name">${escapeHtml(snail.name)}${isPrimary ? " (主 snail)" : ""}</div>
            <div class="meta" style="margin-top: 6px;">${escapeHtml(snail.runtime)}</div>
            <div class="meta" style="margin-top: 8px;">${escapeHtml(snail.description || "")}</div>
            <div class="meta" style="margin-top: 10px;">Identity</div>
            <pre>${escapeHtml(snail.system_prompt?.identity || "")}</pre>
            <div class="meta" style="margin-top: 10px;">Principles</div>
            <ul style="margin-left: 18px; color: #cbd5e1; line-height: 1.6;">${principles}</ul>
            <div class="meta" style="margin-top: 10px;">Working Rules</div>
            <ul style="margin-left: 18px; color: #cbd5e1; line-height: 1.6;">${workingRules}</ul>
            <div class="meta" style="margin-top: 10px;">Preferred Artifacts</div>
            <pre>${escapeHtml(preferredArtifacts || "")}</pre>
          </div>
        `;
      }).join("");
      const input = Array.isArray(definition.input) ? definition.input.join(", ") : "";
      const required = Array.isArray(definition.output?.required_artifacts) ? definition.output.required_artifacts.join(", ") : "";
      const requirements = Array.isArray(definition.output?.artifact_requirements)
        ? definition.output.artifact_requirements.map((item) => `<li>${escapeHtml(item)}</li>`).join("")
        : "";
      const acceptance = Array.isArray(definition.acceptance_focus)
        ? definition.acceptance_focus.map((item) => `<li>${escapeHtml(item)}</li>`).join("")
        : "";

      $stageContract.innerHTML = `
        <div class="artifact-card">
          <div class="name">${escapeHtml(definition.title)}</div>
          <div class="meta" style="margin-top: 8px;">参与 Snails: ${escapeHtml(stageSnailNames.join(", ") || "无")}</div>
          <div class="meta" style="margin-top: 6px;">输入: ${escapeHtml(input || "无")}</div>
          <div class="meta" style="margin-top: 6px;">正式交付要求: ${escapeHtml(required || "无")}</div>
          <div class="meta" style="margin-top: 10px;">输出摘要</div>
          <pre>${escapeHtml(definition.output?.summary || "")}</pre>
          <div class="meta" style="margin-top: 10px;">产物要求</div>
          <ul style="margin-left: 18px; color: #cbd5e1; line-height: 1.6;">${requirements}</ul>
          <div class="meta" style="margin-top: 10px;">验收关注点</div>
          <ul style="margin-left: 18px; color: #cbd5e1; line-height: 1.6;">${acceptance}</ul>
          <div class="meta" style="margin-top: 12px;">Snails</div>
          ${snailCards}
        </div>
      `;
    }

    function renderArtifactTypeOptions() {
      $artifactType.innerHTML = "";
      const types = state.currentStage ? (STAGE_DEFINITIONS[state.currentStage.type]?.formal_artifact_types || []) : [];
      if (types.length === 0) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = "无推荐类型";
        $artifactType.appendChild(option);
        return;
      }
      types.forEach((type) => {
        const option = document.createElement("option");
        option.value = type;
        option.textContent = artifactTitle(type);
        $artifactType.appendChild(option);
      });
    }

    function renderArtifacts() {
      $artifactList.innerHTML = "";
      if (!state.currentStage) {
        $artifactList.innerHTML = '<div class="empty-state">未选择阶段</div>';
        return;
      }
      if (state.artifacts.length === 0) {
        $artifactList.innerHTML = '<div class="empty-state">当前阶段还没有 artifact</div>';
        return;
      }
      const formalSet = new Set(state.currentStage.formal_artifacts || []);
      state.artifacts.forEach((artifact) => {
        const card = document.createElement("div");
        card.className = "artifact-card";
        const checked = formalSet.has(artifact.id);
        const definition = state.artifactDefinitions[artifact.artifact_type];
        card.innerHTML = `
          <label style="display:flex; gap:8px; align-items:flex-start; cursor:pointer;">
            <input type="checkbox" data-artifact-id="${artifact.id}" ${checked ? "checked" : ""} style="width:auto; margin-top:4px;">
            <div style="flex:1;">
              <div class="name">${escapeHtml(artifact.title)}</div>
              <div class="meta">${escapeHtml(artifactTitle(artifact.artifact_type))} · ${escapeHtml(artifact.status)} · ${escapeHtml(artifact.storage_type)}</div>
              <div class="meta" style="margin-top: 6px;">${escapeHtml(definition?.description || "")}</div>
              <pre>${escapeHtml(artifact.inline_content || artifact.external_ref || artifact.file_path || "")}</pre>
            </div>
          </label>
        `;
        const checkbox = card.querySelector("input[type=checkbox]");
        checkbox.addEventListener("change", () => {
          if (checkbox.checked) {
            state.selectedFormalArtifactIds.add(artifact.id);
          } else {
            state.selectedFormalArtifactIds.delete(artifact.id);
          }
        });
        if (checked) {
          state.selectedFormalArtifactIds.add(artifact.id);
        }
        $artifactList.appendChild(card);
      });
    }

    function renderDispatchState() {
      $dispatchStateList.innerHTML = "";
      const groups = state.dispatchState?.inbox_groups || [];
      if (!state.currentConversation) {
        $dispatchStateList.innerHTML = '<div class="empty-state">未选择对话</div>';
        return;
      }
      if (!groups.length) {
        $dispatchStateList.innerHTML = '<div class="empty-state">当前没有 dispatch</div>';
        return;
      }

      groups.forEach((group) => {
        const card = document.createElement("div");
        card.className = "dispatch-group";
        const previews = Array.isArray(group.messages)
          ? group.messages.map((message) => `#${message.message_id} ${message.producer_snail || message.role}: ${message.preview || "(空消息)"}`).join("\n")
          : "";
        card.innerHTML = `
          <div class="name">${escapeHtml(group.target_snail)}</div>
          <div class="meta">status: ${escapeHtml(group.status)} · dispatches: ${group.dispatch_ids.length} · messages: ${group.message_ids.length}</div>
          <div class="meta" style="margin-top: 6px;">latest: ${escapeHtml(group.latest_dispatch_at || "")}</div>
          ${previews ? `<div class="dispatch-preview">${escapeHtml(previews)}</div>` : ""}
        `;
        $dispatchStateList.appendChild(card);
      });
    }

    function renderBossMentionsBanner() {
      const mentions = state.activeBossMentions || [];
      if (!mentions.length) {
        $bossMentionsBanner.className = "boss-mentions-banner";
        $bossMentionsBanner.innerHTML = "";
        return;
      }

      $bossMentionsBanner.className = "boss-mentions-banner visible";
      $bossMentionsBanner.innerHTML = '<div class="name">Boss Mentions</div><div class="meta">以下 mention 已在本次进入会话时标记为已读，离开会话或刷新页面后列表会消失。</div>';
      mentions.forEach((mention) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "boss-mention-item";
        button.innerHTML = `<div class="meta">${escapeHtml(mention.producer_snail || "unknown")} · ${escapeHtml(mention.created_at || "")}</div><div>${escapeHtml(mention.preview || "(空消息)")}</div>`;
        button.addEventListener("click", () => jumpToMessage(mention.message_id));
        $bossMentionsBanner.appendChild(button);
      });
    }

    function jumpToMessage(messageId) {
      const node = $messages.querySelector(`[data-message-id="${messageId}"]`);
      if (!node) return;
      node.scrollIntoView({ behavior: "smooth", block: "center" });
      node.classList.add("jump-highlight");
      setTimeout(() => node.classList.remove("jump-highlight"), 2200);
    }

    async function loadProjects() {
      state.projects = await api("GET", "/projects");
      renderProjects();
      if (!state.currentProject && state.projects.length > 0) {
        await selectProject(state.projects[0].id);
      }
    }

    async function selectProject(projectId) {
      state.currentProject = await api("GET", `/projects/${projectId}`);
      state.stages = state.currentProject.stages || [];
      state.currentStage = state.stages.find((stage) => stage.status === "in_progress" || stage.status === "in_review") || state.stages[state.stages.length - 1] || null;
      renderProjects();
      renderStages();
      renderArtifactTypeOptions();
      if (state.currentStage) {
        await loadStageConversations(state.currentStage.id);
        await loadStageArtifacts(state.currentStage.id);
      } else {
        state.conversations = [];
        state.currentConversation = null;
        state.artifacts = [];
        renderConversations();
        renderArtifacts();
      }
      renderHeader();
    }

    async function loadStageConversations(stageId) {
      state.conversations = await api("GET", `/stages/${stageId}/conversations`);
      renderConversations();
      const current = state.currentConversation && state.conversations.find((conversation) => conversation.id === state.currentConversation.id);
      if (current) {
        await selectConversation(current.id);
      } else if (state.conversations[0]) {
        await selectConversation(state.conversations[0].id);
      } else {
        state.currentConversation = null;
        $messages.innerHTML = "";
        renderHeader();
      }
    }

    async function refreshConversationBadges() {
      if (!state.currentStage) return;
      const latest = await api("GET", `/stages/${state.currentStage.id}/conversations`);
      state.conversations = latest;
      if (state.currentConversation) {
        state.currentConversation = latest.find((conversation) => conversation.id === state.currentConversation.id) || state.currentConversation;
      }
      renderConversations();
      renderHeader();
    }

    function applyConversationBadgeUpdate(payload) {
      const index = state.conversations.findIndex((conversation) => conversation.id === payload.conversation_id);
      if (index === -1) return;
      state.conversations[index] = {
        ...state.conversations[index],
        boss_pending_count: payload.boss_pending_count,
      };
      if (state.currentConversation?.id === payload.conversation_id) {
        state.currentConversation = state.conversations[index];
      }
      renderConversations();
      renderHeader();
    }

    async function loadStageArtifacts(stageId) {
      state.artifacts = await api("GET", `/stages/${stageId}/artifacts`);
      state.selectedFormalArtifactIds = new Set((state.currentStage && state.currentStage.formal_artifacts) || []);
      renderArtifacts();
    }

    async function loadMessages(conversationId) {
      $messages.innerHTML = "";
      const messages = await api("GET", `/conversations/${conversationId}/messages`);
      state.currentMessages = messages;
      messages.forEach((message) => {
        const textPart = (message.parts || []).find((part) => part.part_type === "content");
        const systemPart = (message.parts || []).find((part) => part.part_type === "system_event");
        const structured = textPart ? tryParseStructuredText(partText(textPart)) : null;
        if (message.role === "assistant") {
          renderAssistantHistoryMessage(message);
        } else if (message.role === "system") {
          const systemContent = formatDisplayTextContent(partText(systemPart) || partText(textPart) || "");
          if (systemContent) addMsg("system", systemContent, "system");
        } else if (structured?.type === "question") {
          renderQuestionMessage(message);
        } else {
          const parts = message.parts || [];
          const formattedText = formatStructuredMessageContent(message, textPart);
          const content = formattedText || partText(textPart) || "";
          if (content) {
            const shell = markMessageNode(addMsg(message.role, content, message.producer_snail || message.role), message.id);
            const quoteBlock = createQuoteBlock(message);
            if (quoteBlock) shell.insertBefore(quoteBlock, shell.children[1] || null);
            appendMessageActions(shell, message);
          }
        }
      });
      state.dispatchState = await api("GET", `/conversations/${conversationId}/dispatch-state`);
      renderDispatchState();
    }

    function connectWS(conversationId) {
      if (state.ws) state.ws.close();
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      state.ws = new WebSocket(`${proto}//${location.host}/ws?conversation_id=${conversationId}`);
      state.ws.streamShell = null;
      state.ws.streamContainer = null;
      state.ws.streamedParts = [];
      state.ws.activeSnailName = null;
      state.ws.onmessage = (event) => {
        const message = JSON.parse(event.data);
        if (message.type === "agent_event") {
          const ev = message.event;
          if (ev.type === "turn_start") {
            state.ws.activeSnailName = ev.snail_name || state.ws.activeSnailName;
            if (!state.ws.streamShell) {
              ensureAssistantLoadingShell(state.ws.activeSnailName);
            }
          } else if (ev.type === "text") {
            removeLoadingMessage();
            state.ws.activeSnailName = ev.snail_name || state.ws.activeSnailName;
            if ((ev.content || "").startsWith("[system] ")) {
              addMsg("system", formatDisplayTextContent(ev.content), "system");
              refreshConversationBadges().catch(() => {});
              return;
            }
            appendStreamingTextPart(ev.content);
            refreshConversationBadges().catch(() => {});
          } else if (ev.type === "tool_use") {
            removeLoadingMessage();
            state.ws.activeSnailName = ev.snail_name || state.ws.activeSnailName;
            appendStreamingToolUse(ev.name, ev.summary, ev.detail);
          } else if (ev.type === "result") {
            removeLoadingMessage();
            state.ws.activeSnailName = ev.snail_name || state.ws.activeSnailName;
            finalizeStreamingResult(ev.content);
            refreshConversationBadges().catch(() => {});
            $send.disabled = false;
          } else if (ev.type === "error") {
            removeLoadingMessage();
            if (state.ws.streamShell) {
              state.ws.streamShell.textContent = `Error: ${ev.error}`;
              state.ws.streamShell.classList.remove("loading");
            }
            state.ws.streamShell = null;
            state.ws.streamContainer = null;
            state.ws.streamedParts = [];
            state.ws.activeSnailName = null;
            $send.disabled = false;
          }
        } else if (message.type === "error") {
          addMsg("system", `Error: ${message.error}`, "system");
          $send.disabled = false;
        } else if (message.type === "conversation_badge") {
          applyConversationBadgeUpdate(message.payload);
        }
      };
    }

    async function selectConversation(conversationId) {
      state.currentConversation = state.conversations.find((conversation) => conversation.id === conversationId) || null;
      state.replyToMessage = null;
      state.activeBossMentions = [];
      renderReplyBanner();
      renderBossMentionsBanner();
      renderConversations();
      renderHeader();
      if (!state.currentConversation) return;
      state.activeBossMentions = await api("POST", `/conversations/${conversationId}/boss-mentions/ack`, {});
      await loadMessages(conversationId);
      connectWS(conversationId);
      hideMentionSuggestions();
      updateMentionComposer();
      renderBossMentionsBanner();
      renderDispatchState();
    }

    async function createProject() {
      const name = prompt("项目名称")?.trim();
      if (!name) return;
      const summary = prompt("项目摘要（可选）") || "";
      state.currentProject = null;
      await api("POST", "/projects", { name, summary });
      await loadProjects();
    }

    async function createConversation() {
      if (!state.currentProject || !state.currentStage) return;
      const title = prompt("对话标题")?.trim();
      if (!title) return;
      await api("POST", `/stages/${state.currentStage.id}/conversations`, {
        project_id: state.currentProject.id,
        title,
        kind: "discussion",
        from_conversation_ids: state.currentConversation ? [state.currentConversation.id] : [],
      });
      await loadStageConversations(state.currentStage.id);
    }

    async function createArtifact() {
      if (!state.currentConversation || !state.currentStage) return;
      if (!$artifactType.value) return;
      const title = $artifactTitle.value.trim() || $artifactType.value;
      const inlineContent = $artifactContent.value.trim();
      await api("POST", `/conversations/${state.currentConversation.id}/artifacts`, {
        artifact_type: $artifactType.value,
        title,
        inline_content: inlineContent,
      });
      $artifactTitle.value = "";
      $artifactContent.value = "";
      await loadStageArtifacts(state.currentStage.id);
    }

    async function setFormalArtifacts() {
      if (!state.currentStage) return;
      try {
        const updatedStage = await api("PUT", `/stages/${state.currentStage.id}/formal-artifacts`, {
          artifact_ids: Array.from(state.selectedFormalArtifactIds),
        });
        state.currentStage = updatedStage;
        state.stages = state.stages.map((stage) => stage.id === updatedStage.id ? updatedStage : stage);
        renderStages();
        renderArtifacts();
        renderHeader();
        showNotice("已更新本阶段的正式交付产物");
      } catch (err) {
        showNotice(`设置正式交付失败：${err.message}`, true);
      }
    }

    async function createNextStage() {
      if (!state.currentProject || !state.currentStage) return;
      const currentDefinition = STAGE_DEFINITIONS[state.currentStage.type];
      const currentOrder = currentDefinition?.order;
      const hasNext = Object.values(STAGE_DEFINITIONS).some((definition) => definition.order === currentOrder + 1);
      if (!hasNext) {
        alert("当前已是最后阶段，无法继续推进。");
        return;
      }
      const result = await api("POST", `/projects/${state.currentProject.id}/advance`, {});

      state.stages = state.stages.map((stage) =>
        stage.id === result.completed_stage.id ? result.completed_stage : stage
      );
      state.stages.push(result.next_stage);
      state.currentStage = result.next_stage;

      state.conversations = [result.conversation];
      state.currentConversation = result.conversation;
      state.artifacts = [];
      state.selectedFormalArtifactIds = new Set();

      const refreshedProject = await api("GET", `/projects/${state.currentProject.id}`);
      state.currentProject = refreshedProject;
      state.projects = state.projects.map((project) =>
        project.id === refreshedProject.id ? { ...project, ...refreshedProject } : project
      );

      renderProjects();
      renderStages();
      renderConversations();
      renderArtifacts();
      renderArtifactTypeOptions();
      renderHeader();

      await loadMessages(result.conversation.id);
      connectWS(result.conversation.id);
    }

    async function refreshProject() {
      if (!state.currentProject) return;
      const id = state.currentProject.id;
      state.currentProject = null;
      await loadProjects();
      await selectProject(id);
    }

    async function send() {
      const content = $input.value.trim();
      if (!content || !state.currentConversation) return;
      clearInvalidMentionRanges();
      const parts = buildComposerParts();
      const replyToMessageId = state.replyToMessage?.id ?? null;
      $input.value = "";
      mentionState.selectedMentions = [];
      hideMentionSuggestions();
      setMentionStatus("");
      setReplyTarget(null);
      $send.disabled = true;
      addMsg("user", content, "Boss Snail");
      if (state.ws && state.ws.readyState === WebSocket.OPEN) {
        state.ws.streamShell = null;
        state.ws.streamContainer = null;
        state.ws.streamedParts = [];
        state.ws.activeSnailName = null;
        state.ws.send(JSON.stringify({ type: "send_message", parts, producer_snail: "Boss Snail", reply_to_message_id: replyToMessageId }));
      } else {
        try {
          const result = await api("POST", `/conversations/${state.currentConversation.id}/messages`, { parts, producer_snail: "Boss Snail", reply_to_message_id: replyToMessageId });
          removeLoadingMessage();
          addMsg("assistant", result.reply);
          await refreshConversationBadges();
        } catch (err) {
          const loading = $messages.querySelector(".msg.loading");
          if (loading) {
            loading.textContent = `Error: ${err.message}`;
            loading.classList.remove("loading");
          }
        }
        $send.disabled = false;
      }
    }

    async function sendStructuredResponse(content, payload) {
      if (!state.currentConversation) return;
      const replyToMessageId = state.replyToMessage?.id ?? null;
      $send.disabled = true;
      addMsg("user", content, "Boss Snail");
      setReplyTarget(null);
      try {
        if (state.ws && state.ws.readyState === WebSocket.OPEN) {
          state.ws.streamShell = null;
          state.ws.streamContainer = null;
          state.ws.streamedParts = [];
          state.ws.activeSnailName = null;
        }
        const result = await api("POST", `/conversations/${state.currentConversation.id}/messages`, {
          parts: [
            {
              part_type: "content",
              text_value: JSON.stringify(payload, null, 2),
            }
          ],
          producer_snail: "Boss Snail",
          reply_to_message_id: replyToMessageId,
        });
        removeLoadingMessage();
        if (result.reply) {
          // actual assistant content will already be persisted and loaded on refresh if needed
        }
        await refreshConversationBadges();
        await loadMessages(state.currentConversation.id);
      } catch (err) {
        const loading = $messages.querySelector(".msg.loading");
        if (loading) {
          loading.textContent = `Error: ${err.message}`;
          loading.classList.remove("loading");
        }
      }
      $send.disabled = false;
    }

    document.getElementById("new-project-btn").addEventListener("click", createProject);
    document.getElementById("new-conversation-btn").addEventListener("click", createConversation);
    document.getElementById("create-artifact-btn").addEventListener("click", createArtifact);
    document.getElementById("set-formal-artifact-btn").addEventListener("click", setFormalArtifacts);
    document.getElementById("next-stage-btn").addEventListener("click", createNextStage);
    $send.addEventListener("click", send);
    $input.addEventListener("input", updateMentionComposer);
    $input.addEventListener("input", clearInvalidMentionRanges);
    $input.addEventListener("keydown", (event) => {
      if (mentionState.active && mentionState.suggestions.length) {
        if (event.key === "ArrowDown") {
          event.preventDefault();
          mentionState.selectedIndex = (mentionState.selectedIndex + 1) % mentionState.suggestions.length;
          renderMentionSuggestions();
          return;
        }
        if (event.key === "ArrowUp") {
          event.preventDefault();
          mentionState.selectedIndex = (mentionState.selectedIndex - 1 + mentionState.suggestions.length) % mentionState.suggestions.length;
          renderMentionSuggestions();
          return;
        }
        if (event.key === "Tab" || event.key === "Enter") {
          if (event.key === "Enter" && event.shiftKey) return;
          event.preventDefault();
          applyMentionSuggestion(mentionState.selectedIndex);
          return;
        }
      }
      if (event.key === "Escape") {
        hideMentionSuggestions();
        setMentionStatus("");
        return;
      }
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        send();
      }
    });
    $input.addEventListener("click", updateMentionComposer);
    $input.addEventListener("focus", updateMentionComposer);
    $replyCancel.addEventListener("click", () => setReplyTarget(null));

    (async function init() {
      try {
        STAGE_DEFINITIONS = await api("GET", "/meta/stages");
        state.artifactDefinitions = await api("GET", "/meta/artifacts");
        state.snails = await api("GET", "/snails");
        await loadProjects();
      } catch (err) {
        showNotice(`初始化失败：${err.message}`, true);
      }
      $input.focus();
    })();

    function buildComposerParts() {
      const value = $input.value;
      const mentions = [...mentionState.selectedMentions].sort((left, right) => left.start - right.start);

      // Extract unique snail names from mentions
      const mentionedSnails = [...new Set(mentions.map(m => m.snail.name))];

      // Build a single content part with mentions array
      return [{
        part_type: "content",
        text_value: value,
        mentions: mentionedSnails.length > 0 ? mentionedSnails : undefined
      }];
    }
  </script>
</body>
