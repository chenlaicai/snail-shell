# 文件名即 key: code-delivery

name: 代码交付
description: 开发 → 检视 → 合入。

stage_definitions:
  - key: development
    title: 开发
    sequence: 1
    input_description: 用户需求。
    output_description: 实现完成，PR 已提交。
    acceptance_checklist:
      - id: dev-01
        description: 测试通过
        required: true
    roles:
      - key: developer
        name: 开发者
        is_primary: true
        handbook: "@development#developer.handbook.md"

  - key: review
    title: 检视
    sequence: 2
    input_description: PR。
    output_description: 检视通过。
    acceptance_checklist:
      - id: rev-01
        description: 检视意见已处理
        required: true
    roles:
      - key: reviewer
        name: 审查者
        handbook: "@review#reviewer.handbook.md"
