# SOP: 演进治理流程
# 来源: platform
# 文件名即 key: evolution

name: 演进治理流程
description: 演进项治理。入口校验、查重、分析、裁决和产物处理。

stage_definitions:
  - key: development
    title: 演进治理
    description: 完成演进项治理，必要时提交系统提示词、skill、文档、代码或检查器 PR，并回写治理去向。
    roles:
      - key: executor
        name: 演进执行者
        description: 负责演进项的治理对话：入口校验、查重、分析、裁决和必要产物处理。
        is_primary: true
        count: 1
        skill: evo-executor

# 无 transitions — 单阶段即终态
