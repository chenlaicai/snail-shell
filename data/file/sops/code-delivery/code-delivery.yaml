# SOP: 代码交付流程
# 来源: platform
# 文件名即 key: code-delivery

name: 代码交付流程
description: 标准软件研发交付流程：需求对齐与设计 → 研发实现 → PR 检视 → 合入。

shared_skill: cd-shared

stage_definitions:
  - key: design
    title: 需求对齐与设计
    description: |
      两位架构师交叉审视需求，产出锁定的 Feature 文档。
      GATE-1: 必须先创建 worktree 并切换到 worktree 目录，再进行任何文件操作。
      验证：pwd 输出必须包含 .snail/worktrees/。
      违反 GATE-1 的任何产出（feature 文档、代码）必须迁移到 worktree 后才能继续。
    auto_advance:
      required_context_fields: [worktree_path, branch_name]
      gate_ids: [design-01, design-02]
      accepted_signal_types: [adversarial_consensus]
    roles:
      - key: designer
        name: 架构师
        description: 负责需求对齐与设计，两位架构师交叉审视，产出锁定的 Feature 文档。
        is_primary: true
        count: 2
        skill: cd-design
        prohibition: 不得编写或修改代码，不得越界到实现细节，方案完整性优先于改动量
        self_check: 如果发现自己在说具体修改某个文件的某行，立即停止

  - key: development
    title: 研发实现
    description: 按设计方案完成实现、自检，并提交一个可检视的 PR。
    auto_advance:
      required_context_fields: [worktree_path, branch_name, pr_url]
      gate_ids: [dev-01, dev-02, dev-03, dev-04, dev-06]
      accepted_signal_types: [gate_complete]
    roles:
      - key: developer
        name: 开发者
        description: 负责按设计方案实现、自检、提交 PR。
        is_primary: true
        skill: cd-development
        prohibition: 不得跳过测试，不得引入兼容性桥接代码
        self_check: 如果发现自己在写 ALTER TABLE 或兼容性 shim，立即停止

  - key: review
    title: PR 检视
    description: 两位审查者对抗性检视 PR，开发者回应和修复，直到没有待处理问题。
    auto_advance:
      required_context_fields: [pr_url]
      gate_ids: [rev-01, rev-02, rev-03, rev-04]
      accepted_signal_types: [adversarial_consensus]
      blocking_rules:
        - type: incompatible_tag
    roles:
      - key: developer
        name: 开发者
        description: 在审查阶段回应检视意见、修复代码并推动检视清零。
        skill: cd-review-dev
      - key: reviewer
        name: 审查者
        description: 负责对 PR 做对抗性代码检视，两位审查者交叉审视，在 PR 上留下可追溯评论。
        is_primary: true
        count: 2
        skill: cd-review
        prohibition: 不得使用低风险标签跳过问题，不得替开发者做决定
        self_check: 如果发现自己在说这个问题不重要，立即停止

  - key: merge
    title: 合入
    description: 维护者执行硬性条件检查，全部通过则使用 Squash Merge 合入 PR，任一不通过则打回到审查阶段。
    roles:
      - key: merger
        name: 维护者
        description: 负责 PR 合入前的硬性条件检查，通过则合入，不通过则打回到审查阶段。
        is_primary: true
        skill: cd-merge

transitions:
  # 线性前进路径
  - from: design
    to: development
  - from: development
    to: review
  - from: review
    to: merge

  # 打回路径
  - from: development
    to: design
  - from: review
    to: design
  - from: merge
    to: review
