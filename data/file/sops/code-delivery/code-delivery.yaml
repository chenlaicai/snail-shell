# SOP: 代码交付流程
# 来源: platform
# 文件名即 key: code-delivery

name: 代码交付流程
description: 标准软件研发交付流程：需求对齐与设计 → 研发实现 → PR 检视 → 合入。
first_stage: design

shared_handbook: "@shared.handbook.md"

stage_definitions:
  - key: design
    title: 需求对齐与设计
    sequence: 1
    input_description: 用户需求描述。
    output_description: >
      两位架构师交叉审视需求，产出锁定的 Feature 文档。产物要求：
      Feature 文档的 [design-time] 章节（背景、目标、非目标、设计、生效路径）已完成并锁定；
      无未解决的设计争议；关键设计取舍有正反两面论述记录。
    acceptance_focus:
      - 两位架构师是否均明确表示设计方案可接受
      - Feature 文档的 [design-time] 章节是否已锁定
      - 是否有未解决的设计争议
    acceptance_checklist:
      - id: design-01
        description: Feature 文档的 [design-time] 章节已锁定
        required: true
      - id: design-02
        description: 无未解决的设计争议
        required: true
      - id: design-03
        description: 关键设计取舍有正反两面论述记录
        required: false
    roles:
      - key: designer
        name: 架构师
        description: 负责需求对齐与设计，两位架构师交叉审视，产出锁定的 Feature 文档。
        is_primary: true
        count: 2
        handbook: "@design#designer.handbook.md"

  - key: development
    title: 研发实现
    sequence: 2
    input_description: 锁定的 Feature 文档。
    output_description: >
      按设计方案完成实现、自检，并提交一个可检视的 PR。产物要求：
      PR 已提交并可进入检视；Feature 文档的非 [design-time] 章节已更新；
      如果发现设计问题需要打回到设计阶段，须通过问题卡片说明。
    acceptance_focus:
      - 实现是否严格遵循 [design-time] 设计方案
      - 实现是否完成必要自检
      - PR 是否已经提交并可进入检视
      - 变更完整性是否经过验证命令确认（旧引用零残留、关联配置一致、启动正常）
    acceptance_checklist:
      - id: dev-01
        description: 代码已在 worktree 中完整实现
        required: true
      - id: dev-02
        description: "自检通过：业务代码按设计意图实现；测试已随业务变更同步更新；测试、构建无报错"
        required: true
      - id: dev-03
        description: Feature 文档已同步更新
        required: true
      - id: dev-04
        description: PR 已创建且包含完整改动摘要
        required: true
      - id: dev-05
        description: 不兼容更新已在 PR 中标注
        required: false
      - id: dev-06
        description: 变更完整性已验证：根据 task_anchor 的 change_type 执行对应验证命令（grep 旧引用零残留、关联配置一致、启动正常等），实际输出已写入 gate_evidence
        required: true
    roles:
      - key: developer
        name: 开发者
        description: 负责按设计方案实现、自检、提交 PR。
        is_primary: true
        handbook: "@development#developer.handbook.md"

  - key: review
    title: PR 检视
    sequence: 3
    input_description: 上一阶段产出的 PR 交付记录。
    output_description: >
      两位审查者对抗性检视 PR，开发者回应和修复，直到没有待处理问题。
      产物要求：记录被检视的 PR；记录审查者结论、开发者处理结果和剩余风险；
      两位审查者均明确表示可等待用户合入后才能完成本阶段。
    acceptance_focus:
      - 两位审查者是否均已在 PR 上留下可追溯评论
      - 两位审查者是否交叉审视了对方的结论
      - 开发者是否逐条处理或理性回应评论
      - 两位审查者是否均明确表示可等待用户合入
      - 审查者是否独立执行了验证命令并将输出作为证据
    acceptance_checklist:
      - id: rev-01
        description: 所有检视意见已逐条处理
        required: true
      - id: rev-02
        description: 根据变更类型独立执行验证命令（与开发者使用同一组命令），实际输出作为检视证据写入 gate_evidence；不允许以 "看了 diff" 作为唯一 evidence
        required: true
      - id: rev-03
        description: PR 评论已按签名模板收尾
        required: false
    roles:
      - key: developer
        name: 开发者
        description: 在审查阶段回应检视意见、修复代码并推动检视清零。
        is_primary: true
        handbook: "@review#developer.handbook.md"
      - key: reviewer
        name: 审查者
        description: 负责对 PR 做对抗性代码检视，两位审查者交叉审视，在 PR 上留下可追溯评论。
        count: 2
        handbook: "@review#reviewer.handbook.md"

  - key: merge
    title: 合入
    sequence: 4
    input_description: 已通过检视的 PR。
    output_description: >
      维护者执行硬性条件检查，全部通过则使用 Squash Merge 合入 PR，任一不通过则打回到审查阶段。
      产物要求：合入确认或打回原因记录。
    acceptance_focus:
      - PR 是否基于最新 origin/main
      - CI 是否全部通过
      - Feature 文档编号是否合规（包括与 PR 标题编号一致性、是否为最新未使用编号）
      - PR 标题和 commit 模板是否合规
    acceptance_checklist:
      - id: merge-01
        description: PR 基于最新 origin/main
        required: true
      - id: merge-02
        description: CI 全部通过
        required: true
      - id: merge-03
        description: Feature 文档编号合规（包括与 PR 标题编号一致性、是否为最新未使用编号）
        required: true
      - id: merge-04
        description: PR 标题和 commit 模板合规
        required: true
      - id: merge-05
        description: 使用 Squash Merge 合入（禁止普通 merge）
        required: true
    roles:
      - key: merger
        name: 维护者
        description: 负责 PR 合入前的硬性条件检查，通过则合入，不通过则打回到审查阶段。
        is_primary: true
        handbook: "@merge#merger.handbook.md"

transitions:
  # 线性前进路径
  - from: design
    to: development
  - from: development
    to: review
  - from: review
    to: merge

  # 打回路径
  - from: development
    to: design
  - from: review
    to: design
  - from: merge
    to: review
