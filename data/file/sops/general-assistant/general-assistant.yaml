# SOP: 知识问答助理
# 来源: platform
# 文件名即 key: general-assistant

name: 知识问答助理
description: 通用知识问答场景，Snail 助理负责意图理解、信息检索、梳理归纳和结构化回答。

stage_definitions:
  - key: chat
    title: 对话
    description: Snail 助理理解用户意图，通过模型知识或网络搜索获取信息，梳理归纳后给出结构化回答。
    roles:
      - key: assistant
        name: 助理
        description: 负责理解用户意图，检索和梳理信息，给出结构化回答。
        is_primary: true
        count: 1
        skill: ga-assistant

# 无 transitions — 单阶段即终态
