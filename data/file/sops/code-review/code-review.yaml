# SOP: 代码检视流程
# 来源: platform
# 文件名即 key: code-review

name: 代码检视流程
description: 独立的代码检视流程，适用于检视外部提交的 PR（如同一 workspace 项目中别人提交的 PR）。

shared_skill: cd-shared

stage_definitions:
  - key: review
    title: PR 检视
    description: 两位审查者对抗性检视 PR，在 PR 上留下可追溯的检视结论。
    roles:
      - key: reviewer
        name: 审查者
        description: 负责对 PR 做对抗性代码检视，两位审查者交叉审视，在 PR 上留下可追溯评论。
        is_primary: true
        count: 2
        skill: cd-review
        prohibition: 不得使用低风险标签跳过问题，不得替开发者做决定
        self_check: 如果发现自己在说这个问题不重要，立即停止

transitions: []
